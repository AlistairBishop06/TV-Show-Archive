<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#08090c" />
  <title>ShowHub</title>
  <style>
    :root {
      --bg: #08090c;
      --panel: #111319;
      --panel-2: #181b22;
      --text: #f6f7fb;
      --muted: #a2a9b7;
      --border: rgba(255,255,255,.08);
      --accent: #7c5cff;
      --accent-2: #9b86ff;
      --danger: #ff5d6c;
      --shadow: 0 24px 80px rgba(0,0,0,.45);
    }

    * { box-sizing: border-box; }
    html { scroll-behaviour: smooth; }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 20% -10%, rgba(124,92,255,.18), transparent 28rem),
        radial-gradient(circle at 95% 10%, rgba(95,165,255,.08), transparent 26rem),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    button, input, select { font: inherit; }

    .app-shell {
      width: min(1500px, calc(100% - 36px));
      margin: 0 auto;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 30;
      backdrop-filter: blur(18px);
      background: linear-gradient(to bottom, rgba(8,9,12,.94), rgba(8,9,12,.76), transparent);
      padding: 18px 0 24px;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 850;
      letter-spacing: -.045em;
      white-space: nowrap;
    }

    .brand span {
      color: var(--accent-2);
    }

    .search {
      position: relative;
      flex: 1;
      max-width: 580px;
      margin-left: auto;
    }

    .search input {
      width: 100%;
      background: rgba(255,255,255,.055);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 999px;
      padding: 12px 16px 12px 42px;
      outline: none;
      transition: .18s ease;
    }

    .search input:focus {
      border-color: rgba(124,92,255,.65);
      background: rgba(255,255,255,.075);
      box-shadow: 0 0 0 4px rgba(124,92,255,.11);
    }

    .search::before {
      content: "⌕";
      position: absolute;
      left: 16px;
      top: 8px;
      font-size: 1.45rem;
      color: var(--muted);
      pointer-events: none;
    }

    .hero {
      margin: 8px 0 38px;
      min-height: 390px;
      border-radius: 28px;
      overflow: hidden;
      position: relative;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      background: #12141a;
      isolation: isolate;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center 25%;
      z-index: -2;
      transform: scale(1.02);
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        linear-gradient(90deg, rgba(7,8,11,.98) 0%, rgba(7,8,11,.82) 37%, rgba(7,8,11,.20) 72%),
        linear-gradient(0deg, rgba(7,8,11,.88) 0%, transparent 55%);
    }

    .hero-content {
      min-height: 390px;
      display: flex;
      flex-direction: column;
      justify-content: end;
      padding: clamp(28px, 5vw, 62px);
      max-width: 690px;
    }

    .eyebrow {
      color: #c7bdff;
      font-weight: 750;
      letter-spacing: .12em;
      text-transform: uppercase;
      font-size: .72rem;
      margin-bottom: 10px;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(2.4rem, 5vw, 5rem);
      line-height: .95;
      letter-spacing: -.06em;
    }

    .hero p {
      max-width: 580px;
      color: #c3c8d2;
      font-size: 1rem;
      line-height: 1.6;
      margin: 18px 0 22px;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 11px;
    }

    .btn {
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      padding: 11px 17px;
      font-weight: 750;
      transition: transform .16s ease, opacity .16s ease, background .16s ease;
    }

    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }

    .btn-primary {
      background: var(--text);
      color: #090a0d;
    }

    .btn-secondary {
      color: var(--text);
      background: rgba(255,255,255,.11);
      border: 1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(8px);
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 17px;
    }

    .section-head h2 {
      margin: 0;
      font-size: 1.35rem;
      letter-spacing: -.03em;
    }

    .section-head small {
      color: var(--muted);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 19px;
      padding-bottom: 70px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 17px;
      overflow: hidden;
      cursor: pointer;
      transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: rgba(255,255,255,.16);
      box-shadow: 0 18px 45px rgba(0,0,0,.34);
    }

    .poster {
      aspect-ratio: 2/3;
      overflow: hidden;
      background:
        linear-gradient(135deg, rgba(124,92,255,.22), rgba(255,255,255,.035)),
        #171923;
      position: relative;
    }

    .poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .28s ease;
    }

    .card:hover .poster img {
      transform: scale(1.035);
    }

    .poster-fallback {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      padding: 22px;
      text-align: center;
      color: #d7d4e8;
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: -.03em;
    }

    .card-body {
      padding: 13px 13px 15px;
    }

    .card-title {
      font-weight: 780;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -.015em;
    }

    .card-meta {
      color: var(--muted);
      font-size: .82rem;
      margin-top: 5px;
    }

    .empty {
      grid-column: 1/-1;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 18px;
      padding: 40px;
      text-align: center;
    }

    .modal-wrap {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      place-items: center;
      padding: 24px;
      background: rgba(0,0,0,.74);
      backdrop-filter: blur(13px);
    }

    .modal-wrap.open { display: grid; }

    .modal {
      width: min(900px, 100%);
      max-height: min(760px, 90vh);
      overflow: auto;
      border: 1px solid rgba(255,255,255,.11);
      border-radius: 23px;
      background: #101218;
      box-shadow: var(--shadow);
    }

    .modal-banner {
      min-height: 260px;
      padding: 34px;
      display: flex;
      flex-direction: column;
      justify-content: end;
      position: relative;
      background-size: cover;
      background-position: center 25%;
      isolation: isolate;
    }

    .modal-banner::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        linear-gradient(0deg, #101218 0%, rgba(16,18,24,.75) 40%, rgba(16,18,24,.25) 100%),
        linear-gradient(90deg, rgba(16,18,24,.88), transparent 68%);
    }

    .close {
      position: absolute;
      top: 17px;
      right: 17px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.48);
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .modal h2 {
      font-size: clamp(2rem, 5vw, 3.4rem);
      margin: 0;
      letter-spacing: -.055em;
    }

    .modal-content {
      padding: 7px 34px 34px;
    }

    .modal-desc {
      color: var(--muted);
      line-height: 1.6;
      max-width: 700px;
      margin: 0 0 28px;
    }

    .selector-bar {
      display: flex;
      align-items: end;
      gap: 13px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    label {
      display: grid;
      gap: 7px;
      color: #c6cad4;
      font-size: .82rem;
      font-weight: 700;
    }

    select {
      min-width: 150px;
      color: var(--text);
      border: 1px solid var(--border);
      background: var(--panel-2);
      border-radius: 11px;
      padding: 10px 12px;
      outline: none;
    }

    .episode-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
    }

    .episode {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel-2);
      color: var(--text);
      text-align: left;
      padding: 14px;
      cursor: pointer;
      transition: .16s ease;
    }

    .episode:hover {
      background: #20232c;
      border-color: rgba(124,92,255,.5);
      transform: translateY(-2px);
    }

    .episode small {
      display: block;
      color: var(--muted);
      margin-top: 5px;
    }




    .continue-section {
      display: none;
      margin: 0 0 38px;
    }

    .continue-section.visible {
      display: block;
    }

    .continue-row {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(300px, 360px);
      gap: 14px;
      overflow-x: auto;
      padding: 2px 2px 14px;
      scrollbar-width: thin;
      scroll-snap-type: x proximity;
    }

    .continue-card {
      scroll-snap-align: start;
      display: grid;
      grid-template-columns: 96px minmax(0, 1fr);
      min-height: 144px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 17px;
      background: var(--panel);
      cursor: pointer;
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }

    .continue-card:hover {
      transform: translateY(-3px);
      border-color: rgba(124,92,255,.45);
      background: #151820;
    }


    .continue-card {
      position: relative;
    }

    .continue-remove {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 3;
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 50%;
      background: rgba(5,6,9,.78);
      color: #fff;
      font-size: 1rem;
      line-height: 1;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: background .16s ease, transform .16s ease, border-color .16s ease;
    }

    .continue-remove:hover {
      background: rgba(255,93,108,.9);
      border-color: rgba(255,93,108,1);
      transform: scale(1.05);
    }

    .continue-poster {
      height: 100%;
      min-height: 144px;
      background:
        linear-gradient(135deg, rgba(124,92,255,.2), rgba(255,255,255,.03)),
        #171923;
      overflow: hidden;
    }

    .continue-poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .continue-fallback {
      height: 100%;
      display: grid;
      place-items: center;
      padding: 10px;
      text-align: center;
      font-size: .8rem;
      font-weight: 800;
      color: #d7d4e8;
    }

    .continue-body {
      min-width: 0;
      padding: 15px 15px 13px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .continue-title {
      font-weight: 800;
      letter-spacing: -.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .continue-episode {
      margin-top: 4px;
      color: #c6cad4;
      font-size: .84rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .continue-time {
      margin-top: 11px;
      color: var(--muted);
      font-size: .76rem;
    }

    .progress-track {
      height: 5px;
      margin-top: 7px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255,255,255,.1);
    }

    .progress-fill {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
    }

    .resume-label {
      margin-top: 9px;
      color: #c7bdff;
      font-size: .76rem;
      font-weight: 800;
    }

    .catalogue-actions {
      display: flex;
      justify-content: center;
      padding: 0 0 70px;
    }

    .status-card {
      grid-column: 1 / -1;
      min-height: 180px;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 30px;
      border: 1px dashed var(--border);
      border-radius: 18px;
      color: var(--muted);
      background: rgba(255,255,255,.025);
    }

    .spinner {
      width: 28px;
      height: 28px;
      margin: 0 auto 12px;
      border: 3px solid rgba(255,255,255,.12);
      border-top-color: var(--accent-2);
      border-radius: 50%;
      animation: spin .75s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .episode-name {
      display: block;
      margin-top: 4px;
      color: #d4d7df;
      font-size: .78rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-screen {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: none;
      background: #050609;
      color: var(--text);
    }

    .player-screen.open {
      display: flex;
      flex-direction: column;
    }

    .player-topbar {
      min-height: 66px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      background: rgba(8,9,12,.96);
      backdrop-filter: blur(16px);
    }

    .player-back {
      border: 1px solid var(--border);
      background: rgba(255,255,255,.06);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 750;
    }

    .player-back:hover {
      background: rgba(255,255,255,.10);
    }

    .player-meta {
      min-width: 0;
    }

    .player-title {
      font-weight: 800;
      letter-spacing: -.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-subtitle {
      color: var(--muted);
      font-size: .82rem;
      margin-top: 2px;
    }

    .player-frame-wrap {
      flex: 1;
      min-height: 0;
      background: black;
    }

    .player-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: black;
    }

    @media (max-width: 700px) {
      .app-shell { width: min(100% - 22px, 1500px); }
      .topbar { align-items: stretch; flex-direction: column; gap: 12px; }
      .search { max-width: none; width: 100%; }
      .hero { min-height: 350px; border-radius: 21px; }
      .hero-content { min-height: 350px; padding: 28px 24px; }
      .grid { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
      .continue-row { grid-auto-columns: minmax(280px, 86vw); }
      .modal-wrap { padding: 10px; }
      .modal-banner, .modal-content { padding-left: 22px; padding-right: 22px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="app-shell topbar">
      <div class="brand">SHOW<span>HUB</span></div>
      <div class="search">
        <input id="searchInput" type="search" placeholder="Search your shows..." autocomplete="off" />
      </div>
    </div>
  </header>

  <main class="app-shell">
    <section id="hero" class="hero">
      <div id="heroBg" class="hero-bg"></div>
      <div class="hero-content">
        <div class="eyebrow">Featured from your library</div>
        <h1 id="heroTitle">Your Shows</h1>
        <p id="heroDescription">Keep every series in one place and jump straight into any season and episode.</p>
        <div class="button-row">
          <button id="heroBrowse" class="btn btn-primary">Browse episodes</button>
        </div>
      </div>
    </section>


    <section id="continueSection" class="continue-section">
      <div class="section-head">
        <div>
          <h2>Currently Watching</h2>
          <small>Pick up exactly where you left off</small>
        </div>
      </div>
      <div id="continueRow" class="continue-row"></div>
    </section>

    <section>
      <div class="section-head">
        <div>
          <h2>My Shows</h2>
          <small id="showCount"></small>
        </div>
      </div>
      <div id="showGrid" class="grid"></div>
      <div id="catalogueActions" class="catalogue-actions">
        <button id="loadMoreButton" class="btn btn-secondary">Load more shows</button>
      </div>
    </section>
  </main>


  <section id="playerScreen" class="player-screen" aria-hidden="true">
    <div class="player-topbar">
      <button id="playerBack" class="player-back">← Back to ShowHub</button>
      <div class="player-meta">
        <div id="playerTitle" class="player-title">Now Playing</div>
        <div id="playerSubtitle" class="player-subtitle"></div>
      </div>
    </div>

    <div class="player-frame-wrap">
      <iframe
        id="playerFrame"
        class="player-frame"
        title="Video player"
        allow="autoplay; fullscreen; picture-in-picture"
        allowfullscreen
        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>
    </div>
  </section>

  <div id="modalWrap" class="modal-wrap" aria-hidden="true">
    <div class="modal">
      <div id="modalBanner" class="modal-banner">
        <button id="closeModal" class="close" aria-label="Close">×</button>
        <div class="eyebrow">TV Series</div>
        <h2 id="modalTitle"></h2>
      </div>

      <div class="modal-content">
        <p id="modalDescription" class="modal-desc"></p>

        <div class="selector-bar">
          <label>
            Season
            <select id="seasonSelect"></select>
          </label>

          <button id="continueButton" class="btn btn-primary">Play episode 1</button>
        </div>

        <div id="episodeGrid" class="episode-grid"></div>
      </div>
    </div>
  </div>

  <script>
    const TVMAZE_API = "https://api.tvmaze.com";
    const HOME_PAGE_BATCH = 2;
    const WATCH_HISTORY_KEY = "showhub-watch-history-v1";
    const MAX_WATCH_HISTORY = 40;

    const state = {
      homeShows: [],
      nextHomePage: 0,
      currentShow: null,
      currentSeason: 1,
      currentEpisodes: [],
      searching: false,
      searchTimer: null,
      loadingMore: false,
      activePlayback: null,
      lastProgressWrite: 0
    };

    const el = id => document.getElementById(id);

    const showGrid = el("showGrid");
    const searchInput = el("searchInput");
    const showCount = el("showCount");
    const modalWrap = el("modalWrap");
    const modalTitle = el("modalTitle");
    const modalDescription = el("modalDescription");
    const modalBanner = el("modalBanner");
    const seasonSelect = el("seasonSelect");
    const episodeGrid = el("episodeGrid");
    const continueButton = el("continueButton");
    const playerScreen = el("playerScreen");
    const playerFrame = el("playerFrame");
    const playerTitle = el("playerTitle");
    const playerSubtitle = el("playerSubtitle");
    const loadMoreButton = el("loadMoreButton");
    const catalogueActions = el("catalogueActions");
    const continueSection = el("continueSection");
    const continueRow = el("continueRow");


    function getWatchHistory() {
      try {
        const parsed = JSON.parse(localStorage.getItem(WATCH_HISTORY_KEY) || "[]");
        return Array.isArray(parsed) ? parsed : [];
      } catch {
        return [];
      }
    }

    function setWatchHistory(entries) {
      localStorage.setItem(
        WATCH_HISTORY_KEY,
        JSON.stringify(
          [...entries]
            .sort((a, b) => (b.lastWatched || 0) - (a.lastWatched || 0))
            .slice(0, MAX_WATCH_HISTORY)
        )
      );
    }

    function formatWatchTime(seconds) {
      const total = Math.max(0, Math.floor(Number(seconds) || 0));
      const hours = Math.floor(total / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      const secs = total % 60;

      if (hours) {
        return `${hours}:${String(minutes).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
      }

      return `${minutes}:${String(secs).padStart(2, "0")}`;
    }

    function getSavedEpisode(imdbId, season, episode) {
      return getWatchHistory().find(entry =>
        entry.imdbId === imdbId &&
        Number(entry.season) === Number(season) &&
        Number(entry.episode) === Number(episode)
      );
    }

    function makeWatchEntry(show, season, episode, existing = null) {
      const episodeData = state.currentEpisodes.find(item =>
        Number(item.season) === Number(season) &&
        Number(item.number) === Number(episode)
      );

      return {
        imdbId: show.externals.imdb,
        showId: show.id || existing?.showId || null,
        name: show.name,
        poster: show.image?.medium || show.image?.original || existing?.poster || "",
        backdrop: show.image?.original || show.image?.medium || existing?.backdrop || "",
        summary: stripHtml(show.summary || "") || existing?.summary || "",
        season: Number(season),
        episode: Number(episode),
        episodeName: episodeData?.name || existing?.episodeName || "",
        currentTime: Number(existing?.currentTime) || 0,
        duration: Number(existing?.duration) || 0,
        lastWatched: Date.now()
      };
    }

    function saveWatchEntry(entry) {
      const history = getWatchHistory();
      // Keep one "Currently Watching" card per show. Opening another episode
      // replaces the previous card for that series with the latest episode.
      const withoutCurrentShow = history.filter(
        item => item.imdbId !== entry.imdbId
      );
      setWatchHistory([entry, ...withoutCurrentShow]);
      renderContinueWatching();
    }

    function updatePlaybackProgress(currentTime, duration, eventName = "") {
      if (!state.activePlayback) return;

      const now = Date.now();
      const importantEvent = ["pause", "seeked", "ended"].includes(eventName);

      // timeupdate can fire frequently; writing every few seconds is enough.
      if (!importantEvent && now - state.lastProgressWrite < 3000) return;
      state.lastProgressWrite = now;

      const active = state.activePlayback;
      const existing = getSavedEpisode(
        active.show.externals.imdb,
        active.season,
        active.episode
      );

      const entry = makeWatchEntry(
        active.show,
        active.season,
        active.episode,
        existing
      );

      if (Number.isFinite(Number(currentTime))) {
        entry.currentTime = Math.max(0, Number(currentTime));
      }

      if (Number.isFinite(Number(duration)) && Number(duration) > 0) {
        entry.duration = Number(duration);
      }

      if (eventName === "ended" && entry.duration > 0) {
        entry.currentTime = entry.duration;
      }

      entry.lastWatched = Date.now();
      saveWatchEntry(entry);
    }

    function isVidFastOrigin(origin) {
      try {
        const url = new URL(origin);
        return url.protocol === "https:" &&
          (url.hostname === "vidfast.vc" || url.hostname.endsWith(".vidfast.vc"));
      } catch {
        return false;
      }
    }


    function removeWatchEntry(entry) {
      const updated = getWatchHistory().filter(item =>
        !(
          item.imdbId === entry.imdbId &&
          Number(item.season) === Number(entry.season) &&
          Number(item.episode) === Number(entry.episode)
        )
      );

      setWatchHistory(updated);
      renderContinueWatching();
    }

    function renderContinueWatching() {
      const history = getWatchHistory()
        .sort((a, b) => (b.lastWatched || 0) - (a.lastWatched || 0))
        .slice(0, 12);

      if (!history.length) {
        continueSection.classList.remove("visible");
        continueRow.innerHTML = "";
        return;
      }

      continueSection.classList.add("visible");

      continueRow.innerHTML = history.map((entry, index) => {
        const duration = Number(entry.duration) || 0;
        const current = Number(entry.currentTime) || 0;
        const percentage = duration > 0
          ? Math.max(0, Math.min(100, (current / duration) * 100))
          : 0;

        const timeLabel = duration > 0
          ? `${formatWatchTime(current)} / ${formatWatchTime(duration)} · ${Math.round(percentage)}%`
          : current > 0
            ? `${formatWatchTime(current)} watched`
            : "Started";

        const episodeLabel = `S${entry.season} E${entry.episode}` +
          (entry.episodeName ? ` · ${entry.episodeName}` : "");

        const poster = entry.poster
          ? `<img src="${escapeHtml(entry.poster)}" alt="${escapeHtml(entry.name)} poster">`
          : `<div class="continue-fallback">${escapeHtml(entry.name)}</div>`;

        return `
          <article class="continue-card" data-history-index="${index}" tabindex="0" role="button"
            aria-label="Resume ${escapeHtml(entry.name)} season ${entry.season} episode ${entry.episode}">
            <button
              class="continue-remove"
              type="button"
              data-remove-index="${index}"
              aria-label="Remove ${escapeHtml(entry.name)} from Currently Watching"
              title="Remove from Currently Watching"
            >×</button>
            <div class="continue-poster">${poster}</div>
            <div class="continue-body">
              <div class="continue-title">${escapeHtml(entry.name)}</div>
              <div class="continue-episode">${escapeHtml(episodeLabel)}</div>
              <div class="continue-time">${escapeHtml(timeLabel)}</div>
              <div class="progress-track" aria-hidden="true">
                <div class="progress-fill" style="width:${percentage}%"></div>
              </div>
              <div class="resume-label">▶ Resume</div>
            </div>
          </article>
        `;
      }).join("");

      continueRow.querySelectorAll(".continue-remove").forEach(button => {
        button.addEventListener("click", event => {
          event.stopPropagation();
          removeWatchEntry(history[Number(button.dataset.removeIndex)]);
        });

        button.addEventListener("keydown", event => {
          event.stopPropagation();
        });
      });

      continueRow.querySelectorAll(".continue-card").forEach(card => {
        const resume = () => resumeHistoryEntry(
          history[Number(card.dataset.historyIndex)]
        );

        card.addEventListener("click", resume);
        card.addEventListener("keydown", event => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            resume();
          }
        });
      });
    }

    function resumeHistoryEntry(entry) {
      if (!entry?.imdbId) return;

      const show = {
        id: entry.showId,
        name: entry.name,
        summary: entry.summary || "",
        externals: { imdb: entry.imdbId },
        image: {
          medium: entry.poster || "",
          original: entry.backdrop || entry.poster || ""
        }
      };

      openEpisode(show, entry.season, entry.episode, {
        startAt: Number(entry.currentTime) || 0
      });
    }

    function stripHtml(value = "") {
      const div = document.createElement("div");
      div.innerHTML = value || "";
      return div.textContent || div.innerText || "";
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function validPlayableShow(show) {
      return Boolean(show?.externals?.imdb);
    }

    function normaliseShows(shows) {
      const seen = new Set();
      return shows.filter(show => {
        if (!validPlayableShow(show) || seen.has(show.id)) return false;
        seen.add(show.id);
        return true;
      });
    }

    function showYear(show) {
      return show.premiered ? show.premiered.slice(0, 4) : "";
    }

    function posterMarkup(show) {
      const image = show?.image?.medium || show?.image?.original;
      if (image) {
        return `<img src="${escapeHtml(image)}" alt="${escapeHtml(show.name)} poster" loading="lazy"
          onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">
          <div class="poster-fallback" style="display:none">${escapeHtml(show.name)}</div>`;
      }
      return `<div class="poster-fallback">${escapeHtml(show.name)}</div>`;
    }

    function showMeta(show) {
      const bits = [];
      const year = showYear(show);
      if (year) bits.push(year);
      if (show.genres?.length) bits.push(show.genres.slice(0, 2).join(" / "));
      if (show.rating?.average) bits.push(`★ ${show.rating.average}`);
      return bits.join(" · ");
    }

    function renderStatus(message, loading = false) {
      showGrid.innerHTML = `
        <div class="status-card">
          <div>
            ${loading ? '<div class="spinner"></div>' : ''}
            ${escapeHtml(message)}
          </div>
        </div>
      `;
      showCount.textContent = "";
    }

    function renderShows(shows, label = null) {
      if (!shows.length) {
        renderStatus("No playable shows found.");
        return;
      }

      showCount.textContent = label || `${shows.length} shows`;

      showGrid.innerHTML = shows.map(show => `
        <article class="card" data-id="${show.id}" tabindex="0" role="button" aria-label="Open ${escapeHtml(show.name)}">
          <div class="poster">${posterMarkup(show)}</div>
          <div class="card-body">
            <div class="card-title">${escapeHtml(show.name)}</div>
            <div class="card-meta">${escapeHtml(showMeta(show))}</div>
          </div>
        </article>
      `).join("");

      const map = new Map(shows.map(show => [String(show.id), show]));

      showGrid.querySelectorAll(".card").forEach(card => {
        const open = () => openShow(map.get(card.dataset.id));
        card.addEventListener("click", open);
        card.addEventListener("keydown", event => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            open();
          }
        });
      });
    }

    async function fetchJson(url) {
      const response = await fetch(url);
      if (!response.ok) throw new Error(`Request failed: ${response.status}`);
      return response.json();
    }

    async function loadHomeBatch() {
      if (state.loadingMore) return;
      state.loadingMore = true;
      loadMoreButton.disabled = true;
      loadMoreButton.textContent = "Loading…";

      if (!state.homeShows.length) {
        renderStatus("Loading the TV catalogue…", true);
      }

      try {
        const pages = Array.from(
          { length: HOME_PAGE_BATCH },
          (_, index) => state.nextHomePage + index
        );

        const results = await Promise.all(
          pages.map(page => fetchJson(`${TVMAZE_API}/shows?page=${page}`))
        );

        const incoming = results.flat();
        state.nextHomePage += HOME_PAGE_BATCH;

        const combined = normaliseShows([...state.homeShows, ...incoming]);

        // Better home-screen ordering: rated shows first while retaining a large,
        // automatically loaded catalogue.
        state.homeShows = combined.sort((a, b) =>
          (b.rating?.average || 0) - (a.rating?.average || 0)
        );

        renderShows(
          state.homeShows,
          `${state.homeShows.length} automatically loaded shows`
        );

        populateHero(state.homeShows[0]);
      } catch (error) {
        console.error(error);
        if (!state.homeShows.length) {
          renderStatus("Could not load the catalogue. Check your connection and try again.");
        }
      } finally {
        state.loadingMore = false;
        loadMoreButton.disabled = false;
        loadMoreButton.textContent = "Load more shows";
      }
    }

    function populateHero(show) {
      if (!show) return;

      el("heroTitle").textContent = show.name;
      el("heroDescription").textContent =
        stripHtml(show.summary) ||
        "Choose a season and episode and watch without leaving ShowHub.";

      const image = show.image?.original || show.image?.medium;
      el("heroBg").style.backgroundImage = image ? `url("${image}")` : "";

      el("heroBrowse").onclick = () => openShow(show);
    }

    async function searchShows(query) {
      const term = query.trim();

      if (!term) {
        state.searching = false;
        catalogueActions.style.display = "flex";
        renderShows(
          state.homeShows,
          `${state.homeShows.length} automatically loaded shows`
        );
        return;
      }

      state.searching = true;
      catalogueActions.style.display = "none";
      renderStatus(`Searching for “${term}”…`, true);

      try {
        const results = await fetchJson(
          `${TVMAZE_API}/search/shows?q=${encodeURIComponent(term)}`
        );

        // Ignore a response if the user has typed something newer.
        if (searchInput.value.trim() !== term) return;

        const shows = normaliseShows(results.map(result => result.show));
        renderShows(shows, `${shows.length} result${shows.length === 1 ? "" : "s"} for “${term}”`);
      } catch (error) {
        console.error(error);
        renderStatus("Search failed. Try again.");
      }
    }

    function buildWatchUrl(show, season, episode, startAt = 0) {
      const params = new URLSearchParams({ autoPlay: "true" });

      if (Number(startAt) >= 5) {
        params.set("startAt", String(Math.floor(Number(startAt))));
      }

      return `https://vidfast.vc/tv/${encodeURIComponent(show.externals.imdb)}/${season}/${episode}?${params.toString()}`;
    }

    function openEpisode(show, season, episode, options = {}) {
      closeModal();

      const existing = getSavedEpisode(show.externals.imdb, season, episode);
      const requestedStart = Number(options.startAt);
      const startAt = Number.isFinite(requestedStart)
        ? requestedStart
        : Number(existing?.currentTime) || 0;

      const watchEntry = makeWatchEntry(show, season, episode, existing);
      watchEntry.lastWatched = Date.now();
      saveWatchEntry(watchEntry);

      state.activePlayback = {
        show,
        season: Number(season),
        episode: Number(episode)
      };
      state.lastProgressWrite = 0;

      playerTitle.textContent = show.name;
      playerSubtitle.textContent =
        `Season ${season} · Episode ${episode}` +
        (startAt >= 5 ? ` · Resuming at ${formatWatchTime(startAt)}` : "");

      playerFrame.src = buildWatchUrl(show, season, episode, startAt);

      playerScreen.classList.add("open");
      playerScreen.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";

      history.pushState(
        { player: true, title: show.name, season, episode },
        "",
        `#watch=${encodeURIComponent(show.externals.imdb)}-s${season}e${episode}`
      );
    }

    function closePlayer({ useHistory = true } = {}) {
      playerScreen.classList.remove("open");
      playerScreen.setAttribute("aria-hidden", "true");
      playerFrame.src = "";
      state.activePlayback = null;
      document.body.style.overflow = "";

      if (useHistory && location.hash.startsWith("#watch=")) {
        history.back();
      }
    }

    async function openShow(show) {
      if (!validPlayableShow(show)) return;

      state.currentShow = show;
      state.currentSeason = 1;
      state.currentEpisodes = [];

      modalTitle.textContent = show.name;
      modalDescription.textContent =
        stripHtml(show.summary) || "Loading episode information…";

      const bg = show.image?.original || show.image?.medium;
      modalBanner.style.backgroundImage = bg
        ? `url("${bg}")`
        : "linear-gradient(135deg, rgba(124,92,255,.22), #151821)";

      seasonSelect.innerHTML = `<option>Loading…</option>`;
      seasonSelect.disabled = true;
      continueButton.disabled = true;
      episodeGrid.innerHTML = `
        <div class="status-card">
          <div><div class="spinner"></div>Loading episodes…</div>
        </div>
      `;

      modalWrap.classList.add("open");
      modalWrap.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";

      try {
        const episodes = await fetchJson(`${TVMAZE_API}/shows/${show.id}/episodes`);

        // TVMaze specials can have no standard episode number; VidFast's URL
        // format needs a concrete season and episode number.
        state.currentEpisodes = episodes.filter(
          episode =>
            Number.isInteger(episode.season) &&
            Number.isInteger(episode.number)
        );

        const seasons = [...new Set(
          state.currentEpisodes.map(episode => episode.season)
        )].sort((a, b) => a - b);

        if (!seasons.length) {
          seasonSelect.innerHTML = "";
          episodeGrid.innerHTML = `<div class="status-card">No numbered episodes were found for this show.</div>`;
          return;
        }

        seasonSelect.innerHTML = seasons.map(
          season => `<option value="${season}">Season ${season}</option>`
        ).join("");

        seasonSelect.disabled = false;
        state.currentSeason = seasons[0];
        renderEpisodes();
      } catch (error) {
        console.error(error);
        seasonSelect.innerHTML = "";
        episodeGrid.innerHTML = `<div class="status-card">Could not load episodes for this show.</div>`;
      }
    }

    function renderEpisodes() {
      const show = state.currentShow;
      const season = Number(seasonSelect.value);
      state.currentSeason = season;

      const episodes = state.currentEpisodes
        .filter(episode => episode.season === season)
        .sort((a, b) => a.number - b.number);

      if (!episodes.length) {
        episodeGrid.innerHTML = `<div class="status-card">No episodes found for this season.</div>`;
        continueButton.disabled = true;
        return;
      }

      episodeGrid.innerHTML = episodes.map(episode => `
        <button class="episode" data-episode="${episode.number}">
          <strong>Episode ${episode.number}</strong>
          <span class="episode-name">${escapeHtml(episode.name || "")}</span>
          <small>S${season} E${episode.number}</small>
        </button>
      `).join("");

      episodeGrid.querySelectorAll(".episode").forEach(button => {
        button.addEventListener("click", () =>
          openEpisode(show, season, Number(button.dataset.episode))
        );
      });

      continueButton.disabled = false;
      continueButton.textContent = `Play episode ${episodes[0].number}`;
      continueButton.onclick = () =>
        openEpisode(show, season, episodes[0].number);
    }

    function closeModal() {
      modalWrap.classList.remove("open");
      modalWrap.setAttribute("aria-hidden", "true");

      if (!playerScreen.classList.contains("open")) {
        document.body.style.overflow = "";
      }
    }

    seasonSelect.addEventListener("change", renderEpisodes);

    searchInput.addEventListener("input", event => {
      clearTimeout(state.searchTimer);
      const value = event.target.value;

      state.searchTimer = setTimeout(() => {
        searchShows(value);
      }, 300);
    });

    loadMoreButton.addEventListener("click", loadHomeBatch);
    el("closeModal").addEventListener("click", closeModal);
    el("playerBack").addEventListener("click", () => closePlayer());

    modalWrap.addEventListener("click", event => {
      if (event.target === modalWrap) closeModal();
    });


    window.addEventListener("message", event => {
      if (!isVidFastOrigin(event.origin)) return;
      if (event.source !== playerFrame.contentWindow) return;

      let message = event.data;

      if (typeof message === "string") {
        try {
          message = JSON.parse(message);
        } catch {
          return;
        }
      }

      if (message?.type !== "PLAYER_EVENT") return;

      const data = message.data || {};
      const eventName = data.event || "";

      if (
        Number.isFinite(Number(data.currentTime)) ||
        Number.isFinite(Number(data.duration))
      ) {
        updatePlaybackProgress(
          Number(data.currentTime),
          Number(data.duration),
          eventName
        );
      }
    });

    window.addEventListener("popstate", () => {
      if (playerScreen.classList.contains("open")) {
        closePlayer({ useHistory: false });
      }
    });

    document.addEventListener("keydown", event => {
      if (event.key !== "Escape") return;

      if (playerScreen.classList.contains("open")) {
        closePlayer();
        return;
      }

      if (modalWrap.classList.contains("open")) closeModal();
    });

    renderContinueWatching();
    loadHomeBatch();
  </script>
</body>
</html>
