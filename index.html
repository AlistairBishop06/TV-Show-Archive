<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#08090c" />
  <title>ShowHub</title>
  <style>
    :root {
      --bg: #08090c;
      --panel: #111319;
      --panel-2: #181b22;
      --text: #f6f7fb;
      --muted: #a2a9b7;
      --border: rgba(255,255,255,.08);
      --accent: #7c5cff;
      --accent-2: #9b86ff;
      --danger: #ff5d6c;
      --shadow: 0 24px 80px rgba(0,0,0,.45);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 20% -10%, rgba(124,92,255,.18), transparent 28rem),
        radial-gradient(circle at 95% 10%, rgba(95,165,255,.08), transparent 26rem),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    button, input, select { font: inherit; }

    .app-shell {
      width: min(1500px, calc(100% - 36px));
      margin: 0 auto;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 30;
      backdrop-filter: blur(18px);
      background: linear-gradient(to bottom, rgba(8,9,12,.94), rgba(8,9,12,.76), transparent);
      padding: 18px 0 24px;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 850;
      letter-spacing: -.045em;
      white-space: nowrap;
    }

    .brand span {
      color: var(--accent-2);
    }

    .search {
      position: relative;
      flex: 1;
      max-width: 580px;
      margin-left: auto;
    }

    .search input {
      width: 100%;
      background: rgba(255,255,255,.055);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 999px;
      padding: 12px 16px 12px 42px;
      outline: none;
      transition: .18s ease;
    }

    .search input:focus {
      border-color: rgba(124,92,255,.65);
      background: rgba(255,255,255,.075);
      box-shadow: 0 0 0 4px rgba(124,92,255,.11);
    }

    .search::before {
      content: "⌕";
      position: absolute;
      left: 16px;
      top: 8px;
      font-size: 1.45rem;
      color: var(--muted);
      pointer-events: none;
    }

    .hero {
      margin: 8px 0 38px;
      min-height: 390px;
      border-radius: 28px;
      overflow: hidden;
      position: relative;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      background: #12141a;
      isolation: isolate;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center 25%;
      z-index: -2;
      transform: scale(1.02);
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        linear-gradient(90deg, rgba(7,8,11,.98) 0%, rgba(7,8,11,.82) 37%, rgba(7,8,11,.20) 72%),
        linear-gradient(0deg, rgba(7,8,11,.88) 0%, transparent 55%);
    }

    .hero-content {
      min-height: 390px;
      display: flex;
      flex-direction: column;
      justify-content: end;
      padding: clamp(28px, 5vw, 62px);
      max-width: 690px;
    }

    .eyebrow {
      color: #c7bdff;
      font-weight: 750;
      letter-spacing: .12em;
      text-transform: uppercase;
      font-size: .72rem;
      margin-bottom: 10px;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(2.4rem, 5vw, 5rem);
      line-height: .95;
      letter-spacing: -.06em;
    }

    .hero p {
      max-width: 580px;
      color: #c3c8d2;
      font-size: 1rem;
      line-height: 1.6;
      margin: 18px 0 22px;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 11px;
    }

    .btn {
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      padding: 11px 17px;
      font-weight: 750;
      transition: transform .16s ease, opacity .16s ease, background .16s ease;
    }

    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }

    .btn-primary {
      background: var(--text);
      color: #090a0d;
    }

    .btn-secondary {
      color: var(--text);
      background: rgba(255,255,255,.11);
      border: 1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(8px);
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 17px;
    }

    .section-head h2 {
      margin: 0;
      font-size: 1.35rem;
      letter-spacing: -.03em;
    }

    .section-head small {
      color: var(--muted);
    }


    .catalogue-layout {
      display: grid;
      grid-template-columns: 230px minmax(0, 1fr);
      gap: 28px;
      align-items: start;
      padding-bottom: 70px;
    }

    .filters-panel {
      position: sticky;
      top: 96px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: rgba(17,19,25,.86);
      backdrop-filter: blur(16px);
      padding: 16px;
    }

    .filters-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 15px;
    }

    .filters-head h3 {
      margin: 0;
      font-size: 1rem;
      letter-spacing: -.02em;
    }

    .filter-reset {
      border: 0;
      background: transparent;
      color: #b8abff;
      font-size: .78rem;
      font-weight: 800;
      cursor: pointer;
      padding: 4px 0;
    }

    .filter-group {
      display: grid;
      gap: 7px;
      margin-top: 13px;
    }

    .filter-group:first-of-type {
      margin-top: 0;
    }

    .filter-group label {
      color: #c7cbd5;
      font-size: .76rem;
      font-weight: 800;
    }

    .filter-group select {
      width: 100%;
      min-width: 0;
      padding: 9px 10px;
      font-size: .84rem;
    }

    .filter-help {
      color: #7f8795;
      font-size: .68rem;
      line-height: 1.35;
      margin-top: 5px;
    }

    .catalogue-main {
      min-width: 0;
    }

    .catalogue-main .grid {
      padding-bottom: 28px;
    }

    .catalogue-actions {
      padding-bottom: 0;
    }

    .media-type-badge {
      position: absolute;
      top: 9px;
      left: 9px;
      z-index: 2;
      padding: 5px 7px;
      border-radius: 7px;
      background: rgba(5,6,9,.78);
      border: 1px solid rgba(255,255,255,.12);
      color: #fff;
      font-size: .64rem;
      line-height: 1;
      font-weight: 900;
      letter-spacing: .08em;
      backdrop-filter: blur(8px);
    }

    .card-meta-secondary {
      color: #747c8c;
      font-size: .73rem;
      margin-top: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .filter-loading {
      display: none;
      margin-top: 14px;
      padding: 10px;
      border-radius: 10px;
      background: rgba(124,92,255,.08);
      color: #bfb5ff;
      font-size: .72rem;
      line-height: 1.4;
    }

    .filter-loading.visible {
      display: block;
    }

    @media (max-width: 980px) {
      .catalogue-layout {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .filters-panel {
        position: static;
      }

      .filters-body {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 11px 13px;
      }

      .filter-group {
        margin-top: 0;
      }

      .filter-loading {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 650px) {
      .filters-body {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 19px;
      padding-bottom: 70px;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 17px;
      overflow: hidden;
      cursor: pointer;
      transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: rgba(255,255,255,.16);
      box-shadow: 0 18px 45px rgba(0,0,0,.34);
    }

    .poster {
      aspect-ratio: 2/3;
      overflow: hidden;
      background:
        linear-gradient(135deg, rgba(124,92,255,.22), rgba(255,255,255,.035)),
        #171923;
      position: relative;
    }

    .poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .28s ease;
    }

    .card:hover .poster img {
      transform: scale(1.035);
    }

    .poster-fallback {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      padding: 22px;
      text-align: center;
      color: #d7d4e8;
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: -.03em;
    }

    .card-body {
      padding: 13px 13px 15px;
    }

    .card-title {
      font-weight: 780;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -.015em;
    }

    .card-meta {
      color: var(--muted);
      font-size: .82rem;
      margin-top: 5px;
    }

    .empty {
      grid-column: 1/-1;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 18px;
      padding: 40px;
      text-align: center;
    }

    .modal-wrap {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      place-items: center;
      padding: 24px;
      background: rgba(0,0,0,.74);
      backdrop-filter: blur(13px);
    }

    .modal-wrap.open { display: grid; }

    .modal {
      width: min(900px, 100%);
      max-height: min(760px, 90vh);
      overflow: auto;
      border: 1px solid rgba(255,255,255,.11);
      border-radius: 23px;
      background: #101218;
      box-shadow: var(--shadow);
    }

    .modal-banner {
      min-height: 260px;
      padding: 34px;
      display: flex;
      flex-direction: column;
      justify-content: end;
      position: relative;
      background-size: cover;
      background-position: center 25%;
      isolation: isolate;
    }

    .modal-banner::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        linear-gradient(0deg, #101218 0%, rgba(16,18,24,.75) 40%, rgba(16,18,24,.25) 100%),
        linear-gradient(90deg, rgba(16,18,24,.88), transparent 68%);
    }

    .close {
      position: absolute;
      top: 17px;
      right: 17px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.48);
      color: white;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .modal h2 {
      font-size: clamp(2rem, 5vw, 3.4rem);
      margin: 0;
      letter-spacing: -.055em;
    }

    .modal-content {
      padding: 7px 34px 34px;
    }

    .modal-desc {
      color: var(--muted);
      line-height: 1.6;
      max-width: 700px;
      margin: 0 0 28px;
    }

    .selector-bar {
      display: flex;
      align-items: end;
      gap: 13px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    label {
      display: grid;
      gap: 7px;
      color: #c6cad4;
      font-size: .82rem;
      font-weight: 700;
    }

    select {
      min-width: 150px;
      color: var(--text);
      border: 1px solid var(--border);
      background: var(--panel-2);
      border-radius: 11px;
      padding: 10px 12px;
      outline: none;
    }

    .episode-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
    }

    .episode {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel-2);
      color: var(--text);
      text-align: left;
      padding: 14px;
      cursor: pointer;
      transition: .16s ease;
    }

    .episode:hover {
      background: #20232c;
      border-color: rgba(124,92,255,.5);
      transform: translateY(-2px);
    }

    .episode small {
      display: block;
      color: var(--muted);
      margin-top: 5px;
    }




    .continue-section {
      display: none;
      margin: 0 0 38px;
    }

    .continue-section.visible {
      display: block;
    }

    .continue-row {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(300px, 360px);
      gap: 14px;
      overflow-x: auto;
      padding: 2px 2px 14px;
      scrollbar-width: thin;
      scroll-snap-type: x proximity;
    }

    .continue-card {
      scroll-snap-align: start;
      display: grid;
      grid-template-columns: 96px minmax(0, 1fr);
      min-height: 144px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 17px;
      background: var(--panel);
      cursor: pointer;
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }

    .continue-card:hover {
      transform: translateY(-3px);
      border-color: rgba(124,92,255,.45);
      background: #151820;
    }


    .continue-card {
      position: relative;
    }

    .continue-remove {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 3;
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 50%;
      background: rgba(5,6,9,.78);
      color: #fff;
      font-size: 1rem;
      line-height: 1;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: background .16s ease, transform .16s ease, border-color .16s ease;
    }

    .continue-remove:hover {
      background: rgba(255,93,108,.9);
      border-color: rgba(255,93,108,1);
      transform: scale(1.05);
    }

    .continue-poster {
      height: 100%;
      min-height: 144px;
      background:
        linear-gradient(135deg, rgba(124,92,255,.2), rgba(255,255,255,.03)),
        #171923;
      overflow: hidden;
    }

    .continue-poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .continue-fallback {
      height: 100%;
      display: grid;
      place-items: center;
      padding: 10px;
      text-align: center;
      font-size: .8rem;
      font-weight: 800;
      color: #d7d4e8;
    }

    .continue-body {
      min-width: 0;
      padding: 15px 15px 13px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .continue-title {
      font-weight: 800;
      letter-spacing: -.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .continue-episode {
      margin-top: 4px;
      color: #c6cad4;
      font-size: .84rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .continue-time {
      margin-top: 11px;
      color: var(--muted);
      font-size: .76rem;
    }

    .progress-track {
      height: 5px;
      margin-top: 7px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255,255,255,.1);
    }

    .progress-fill {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
    }

    .resume-label {
      margin-top: 9px;
      color: #c7bdff;
      font-size: .76rem;
      font-weight: 800;
    }

    .catalogue-actions {
      display: flex;
      justify-content: center;
      padding: 0 0 70px;
    }

    .status-card {
      grid-column: 1 / -1;
      min-height: 180px;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 30px;
      border: 1px dashed var(--border);
      border-radius: 18px;
      color: var(--muted);
      background: rgba(255,255,255,.025);
    }

    .spinner {
      width: 28px;
      height: 28px;
      margin: 0 auto 12px;
      border: 3px solid rgba(255,255,255,.12);
      border-top-color: var(--accent-2);
      border-radius: 50%;
      animation: spin .75s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .episode-name {
      display: block;
      margin-top: 4px;
      color: #d4d7df;
      font-size: .78rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-screen {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: none;
      background: #050609;
      color: var(--text);
    }

    .player-screen.open {
      display: flex;
      flex-direction: column;
    }

    .player-topbar {
      min-height: 66px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      background: rgba(8,9,12,.96);
      backdrop-filter: blur(16px);
    }

    .player-back {
      border: 1px solid var(--border);
      background: rgba(255,255,255,.06);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 750;
    }

    .player-back:hover {
      background: rgba(255,255,255,.10);
    }

    .player-meta {
      min-width: 0;
    }

    .player-title {
      font-weight: 800;
      letter-spacing: -.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-subtitle {
      color: var(--muted);
      font-size: .82rem;
      margin-top: 2px;
    }

    .player-frame-wrap {
      flex: 1;
      min-height: 0;
      background: black;
    }

    .player-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: black;
    }

    @media (max-width: 700px) {
      .app-shell { width: min(100% - 22px, 1500px); }
      .topbar { align-items: stretch; flex-direction: column; gap: 12px; }

    .search { max-width: none; width: 100%; }
      .hero { min-height: 350px; border-radius: 21px; }
      .hero-content { min-height: 350px; padding: 28px 24px; }
      .grid { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
      .continue-row { grid-auto-columns: minmax(280px, 86vw); }
      .modal-wrap { padding: 10px; }
      .modal-banner, .modal-content { padding-left: 22px; padding-right: 22px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="app-shell topbar">
      <div class="search">
        <input id="searchInput" type="search" placeholder="Search movies and TV shows..." autocomplete="off" />
      </div>
    </div>
  </header>

  <main class="app-shell">
    <section id="continueSection" class="continue-section">
      <div class="section-head">
        <div>
          <h2>Currently Watching</h2>
          <small>Pick up exactly where you left off</small>
        </div>
      </div>
      <div id="continueRow" class="continue-row"></div>
    </section>

    <section class="catalogue-layout">
      <aside class="filters-panel" aria-label="Catalogue filters">
        <div class="filters-head">
          <h3>Filters</h3>
          <button id="resetFilters" class="filter-reset" type="button">Reset</button>
        </div>

        <div class="filters-body">
          <div class="filter-group">
            <label for="filterType">Type</label>
            <select id="filterType">
              <option value="all">Movies & TV</option>
              <option value="tv">TV shows only</option>
              <option value="movie">Movies only</option>
            </select>
          </div>

          <div class="filter-group">
            <label for="filterGenre">Genre</label>
            <select id="filterGenre">
              <option value="all">All genres</option>
            </select>
          </div>

          <div class="filter-group">
            <label for="filterRuntime">Length</label>
            <select id="filterRuntime">
              <option value="all">Any length</option>
              <option value="under30">Under 30 min</option>
              <option value="30-60">30–60 min</option>
              <option value="60-120">1–2 hours</option>
              <option value="120plus">2+ hours</option>
            </select>
          </div>

          <div class="filter-group">
            <label for="filterEpisodes">Episodes</label>
            <select id="filterEpisodes">
              <option value="all">Any episode count</option>
              <option value="1-10">1–10 episodes</option>
              <option value="11-25">11–25 episodes</option>
              <option value="26-50">26–50 episodes</option>
              <option value="51-100">51–100 episodes</option>
              <option value="100plus">100+ episodes</option>
            </select>
          </div>

          <div class="filter-group">
            <label for="filterSeasons">Seasons</label>
            <select id="filterSeasons">
              <option value="all">Any seasons</option>
              <option value="1">1 season</option>
              <option value="2-3">2–3 seasons</option>
              <option value="4-6">4–6 seasons</option>
              <option value="7plus">7+ seasons</option>
            </select>
          </div>

          <div class="filter-group">
            <label for="filterYear">Release year</label>
            <select id="filterYear">
              <option value="all">Any year</option>
              <option value="2020s">2020s</option>
              <option value="2010s">2010s</option>
              <option value="2000s">2000s</option>
              <option value="1990s">1990s</option>
              <option value="pre1990">Before 1990</option>
            </select>
          </div>

          <div class="filter-group">
            <label for="filterRating">Minimum rating</label>
            <select id="filterRating">
              <option value="all">Any rating</option>
              <option value="9">9+</option>
