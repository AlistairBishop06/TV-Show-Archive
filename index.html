  <script>
    const TVMAZE_API = "https://api.tvmaze.com";
    const CINEMETA_API = "https://v3-cinemeta.strem.io";
    const HOME_PAGE_BATCH = 1;
    const TV_META_CACHE_KEY = "showhub-tv-meta-v1";
    const MOVIE_META_CACHE_KEY = "showhub-movie-meta-v1";
    const WATCH_HISTORY_KEY = "showhub-watch-history-v2";
    const LEGACY_WATCH_HISTORY_KEY = "showhub-watch-history-v1";
    const MAX_WATCH_HISTORY = 40;

    const state = {
      homeShows: [],
      homeMovies: [],
      searchResults: null,
      searchTerm: "",
      nextHomePage: 0,
      nextMovieSkip: 0,
      tvHasMore: true,
      movieHasMore: true,
      currentShow: null,
      currentSeason: 1,
      currentEpisodes: [],
      searchTimer: null,
      loadingTV: false,
      loadingMovies: false,
      activePlayback: null,
      lastProgressWrite: 0,
      pendingEpisodeAdvance: false,
      episodeAdvanceInFlight: false,
      episodeMetaLoading: new Set(),
      episodeMetaQueueRunning: false,
      movieMetaLoading: new Set(),
      movieMetaQueueRunning: false,
      metadataPreloadRunning: false,
      metadataPreloadScheduled: false,
      filters: {
        type: "all",
        genre: "all",
        runtime: "all",
        episodes: "all",
        seasons: "all",
        year: "all",
        rating: "all",
        status: "all",
        sort: "rating-desc"
      }
    };

    const el = id => document.getElementById(id);

    const showGrid = el("showGrid");
    const searchInput = el("searchInput");
    const showCount = el("showCount");
    const catalogueTitle = el("catalogueTitle");
    const heroEyebrow = el("heroEyebrow");
    const modalWrap = el("modalWrap");
    const modalTitle = el("modalTitle");
    const modalDescription = el("modalDescription");
    const modalBanner = el("modalBanner");
    const seasonSelect = el("seasonSelect");
    const episodeGrid = el("episodeGrid");
    const continueButton = el("continueButton");
    const playerScreen = el("playerScreen");
    const playerFrame = el("playerFrame");
    const playerTitle = el("playerTitle");
    const playerSubtitle = el("playerSubtitle");
    const loadMoreButton = el("loadMoreButton");
    const catalogueActions = el("catalogueActions");
    const continueSection = el("continueSection");
    const continueRow = el("continueRow");
    const resetFilters = el("resetFilters");
    const filterType = el("filterType");
    const filterGenre = el("filterGenre");
    const filterRuntime = el("filterRuntime");
    const filterEpisodes = el("filterEpisodes");
    const filterSeasons = el("filterSeasons");
    const filterYear = el("filterYear");
    const filterRating = el("filterRating");
    const filterStatus = el("filterStatus");
    const filterSort = el("filterSort");
    const filterLoading = el("filterLoading");

    function migrateWatchHistory() {
      if (localStorage.getItem(WATCH_HISTORY_KEY)) return;
      const legacy = localStorage.getItem(LEGACY_WATCH_HISTORY_KEY);
      if (!legacy) return;

      try {
        const entries = JSON.parse(legacy);
        if (!Array.isArray(entries)) return;
        const migrated = entries.map(entry => ({
          ...entry,
          mediaType: entry.mediaType || "tv"
        }));
        localStorage.setItem(WATCH_HISTORY_KEY, JSON.stringify(migrated));
      } catch {
        // Leave broken legacy data alone rather than preventing the app loading.
      }
    }

    function getWatchHistory() {
      try {
        const parsed = JSON.parse(localStorage.getItem(WATCH_HISTORY_KEY) || "[]");
        return Array.isArray(parsed) ? parsed : [];
      } catch {
        return [];
      }
    }

    function setWatchHistory(entries) {
      localStorage.setItem(
        WATCH_HISTORY_KEY,
        JSON.stringify(
          [...entries]
            .sort((a, b) => (b.lastWatched || 0) - (a.lastWatched || 0))
            .slice(0, MAX_WATCH_HISTORY)
        )
      );
    }

    function stripHtml(value = "") {
      const div = document.createElement("div");
      div.innerHTML = value || "";
      return div.textContent || div.innerText || "";
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatWatchTime(seconds) {
      const total = Math.max(0, Math.floor(Number(seconds) || 0));
      const hours = Math.floor(total / 3600);
      const minutes = Math.floor((total % 3600) / 60);
      const secs = total % 60;

      if (hours) {
        return `${hours}:${String(minutes).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
      }
      return `${minutes}:${String(secs).padStart(2, "0")}`;
    }

    function getImdbId(media) {
      return media?.imdbId || media?.externals?.imdb || "";
    }

    function getMediaName(media) {
      return media?.name || media?.title || "Untitled";
    }

    function getMediaPoster(media) {
      return media?.poster || media?.image?.medium || media?.image?.original || "";
    }

    function getMediaBackdrop(media) {
      return media?.backdrop || media?.image?.original || media?.image?.medium || getMediaPoster(media);
    }

    function getMediaSummary(media) {
      return stripHtml(media?.summary || "");
    }

    function getMediaYear(media) {
      if (media?.year) return String(media.year);
      return media?.premiered ? media.premiered.slice(0, 4) : "";
    }

    function getMediaType(media) {
      return media?.mediaType === "movie" ? "movie" : "tv";
    }

    function getSavedPlayback(imdbId) {
      return getWatchHistory().find(entry => entry.imdbId === imdbId);
    }

    function makeWatchEntry(media, options = {}, existing = null) {
      const mediaType = options.mediaType || getMediaType(media);
      const season = mediaType === "tv" ? Number(options.season) : null;
      const episode = mediaType === "tv" ? Number(options.episode) : null;
      const episodeData = mediaType === "tv"
        ? state.currentEpisodes.find(item =>
            Number(item.season) === season && Number(item.number) === episode
          )
        : null;

      return {
        mediaType,
        imdbId: getImdbId(media),
        showId: mediaType === "tv" ? (media.id || existing?.showId || null) : null,
        name: getMediaName(media),
        poster: getMediaPoster(media) || existing?.poster || "",
        backdrop: getMediaBackdrop(media) || existing?.backdrop || "",
        summary: getMediaSummary(media) || existing?.summary || "",
        year: getMediaYear(media) || existing?.year || "",
        season,
        episode,
        episodeName: episodeData?.name || existing?.episodeName || "",
        currentTime: Number(existing?.currentTime) || 0,
        duration: Number(existing?.duration) || 0,
        lastWatched: Date.now()
      };
    }

    function saveWatchEntry(entry) {
      const history = getWatchHistory();
      const withoutCurrentTitle = history.filter(item => item.imdbId !== entry.imdbId);
      setWatchHistory([entry, ...withoutCurrentTitle]);
      renderContinueWatching();
    }

    function removeWatchEntry(entry) {
      setWatchHistory(getWatchHistory().filter(item => item.imdbId !== entry.imdbId));
      renderContinueWatching();
    }

    function updatePlaybackProgress(currentTime, duration, eventName = "") {
      if (!state.activePlayback) return;

      const now = Date.now();
      const importantEvent = ["pause", "seeked", "ended"].includes(eventName);
      if (!importantEvent && now - state.lastProgressWrite < 3000) return;
      state.lastProgressWrite = now;

      const active = state.activePlayback;
      const media = active.media;
      const imdbId = getImdbId(media);
      const existing = getSavedPlayback(imdbId);
      const entry = makeWatchEntry(media, active, existing);

      if (Number.isFinite(Number(currentTime))) {
        entry.currentTime = Math.max(0, Number(currentTime));
      }
      if (Number.isFinite(Number(duration)) && Number(duration) > 0) {
        entry.duration = Number(duration);
      }
      if (eventName === "ended" && entry.duration > 0) {
        entry.currentTime = entry.duration;
      }

      entry.lastWatched = Date.now();
      saveWatchEntry(entry);
    }

    function isVidFastOrigin(origin) {
      try {
        const url = new URL(origin);
        return url.protocol === "https:" &&
          (url.hostname === "vidfast.vc" || url.hostname.endsWith(".vidfast.vc"));
      } catch {
        return false;
      }
    }

    function renderContinueWatching() {
      const history = getWatchHistory()
        .sort((a, b) => (b.lastWatched || 0) - (a.lastWatched || 0))
        .slice(0, 12);

      if (!history.length) {
        continueSection.classList.remove("visible");
        continueRow.innerHTML = "";
        return;
      }

      continueSection.classList.add("visible");
      continueRow.innerHTML = history.map((entry, index) => {
        const duration = Number(entry.duration) || 0;
        const current = Number(entry.currentTime) || 0;
        const percentage = duration > 0
          ? Math.max(0, Math.min(100, (current / duration) * 100))
          : 0;

        const timeLabel = duration > 0
          ? `${formatWatchTime(current)} / ${formatWatchTime(duration)} · ${Math.round(percentage)}%`
          : current > 0
            ? `${formatWatchTime(current)} watched`
            : "Started";

        const detailLabel = entry.mediaType === "movie"
          ? "Movie"
          : `S${entry.season} E${entry.episode}` +
            (entry.episodeName ? ` · ${entry.episodeName}` : "");

        const poster = entry.poster
          ? `<img src="${escapeHtml(entry.poster)}" alt="${escapeHtml(entry.name)} poster">`
          : `<div class="continue-fallback">${escapeHtml(entry.name)}</div>`;

        return `
          <article class="continue-card" data-history-index="${index}" tabindex="0" role="button"
            aria-label="Resume ${escapeHtml(entry.name)}">
            <button
              class="continue-remove"
              type="button"
              data-remove-index="${index}"
              aria-label="Remove ${escapeHtml(entry.name)} from Currently Watching"
              title="Remove from Currently Watching"
            >×</button>
            <div class="continue-poster">${poster}</div>
            <div class="continue-body">
              <div class="continue-title">${escapeHtml(entry.name)}</div>
              <div class="continue-episode">${escapeHtml(detailLabel)}</div>
              <div class="continue-time">${escapeHtml(timeLabel)}</div>
              <div class="progress-track" aria-hidden="true">
                <div class="progress-fill" style="width:${percentage}%"></div>
              </div>
              <div class="resume-label">▶ Resume</div>
            </div>
          </article>
        `;
      }).join("");

      continueRow.querySelectorAll(".continue-remove").forEach(button => {
        button.addEventListener("click", event => {
          event.stopPropagation();
          removeWatchEntry(history[Number(button.dataset.removeIndex)]);
        });
        button.addEventListener("keydown", event => event.stopPropagation());
      });

      continueRow.querySelectorAll(".continue-card").forEach(card => {
        const resume = () => resumeHistoryEntry(history[Number(card.dataset.historyIndex)]);
        card.addEventListener("click", resume);
        card.addEventListener("keydown", event => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            resume();
          }
        });
      });
    }

    function resumeHistoryEntry(entry) {
      if (!entry?.imdbId) return;

      if (entry.mediaType === "movie") {
        const movie = {
          mediaType: "movie",
          imdbId: entry.imdbId,
          name: entry.name,
          year: entry.year || "",
          poster: entry.poster || "",
          backdrop: entry.backdrop || entry.poster || "",
          summary: entry.summary || ""
        };
        openMovie(movie, { startAt: Number(entry.currentTime) || 0 });
        return;
      }

      const show = {
        mediaType: "tv",
        id: entry.showId,
        name: entry.name,
        summary: entry.summary || "",
        externals: { imdb: entry.imdbId },
        image: {
          medium: entry.poster || "",
          original: entry.backdrop || entry.poster || ""
        }
      };

      openEpisode(show, entry.season, entry.episode, {
        startAt: Number(entry.currentTime) || 0
      });
    }

    let tvMetaCacheMemory = null;
    let movieMetaCacheMemory = null;
    let metaCacheFlushTimer = null;

    function scheduleMetaCacheFlush() {
      clearTimeout(metaCacheFlushTimer);
      metaCacheFlushTimer = setTimeout(() => {
        if (tvMetaCacheMemory) {
          localStorage.setItem(
            TV_META_CACHE_KEY,
            JSON.stringify(tvMetaCacheMemory)
          );
        }

        if (movieMetaCacheMemory) {
          localStorage.setItem(
            MOVIE_META_CACHE_KEY,
            JSON.stringify(movieMetaCacheMemory)
          );
        }
      }, 180);
    }

    function getTvMetaCache() {
      if (tvMetaCacheMemory) return tvMetaCacheMemory;

      try {
        const cache = JSON.parse(localStorage.getItem(TV_META_CACHE_KEY) || "{}");
        tvMetaCacheMemory = cache && typeof cache === "object" ? cache : {};
      } catch {
        tvMetaCacheMemory = {};
      }

      return tvMetaCacheMemory;
    }

    function saveTvMeta(show, episodeCount, seasonCount) {
      if (!show?.id) return;

      const cache = getTvMetaCache();
      cache[String(show.id)] = {
        episodeCount: Number(episodeCount) || 0,
        seasonCount: Number(seasonCount) || 0,
        savedAt: Date.now()
      };
      scheduleMetaCacheFlush();

      const update = item => {
        if (item?.mediaType === "tv" && Number(item.id) === Number(show.id)) {
          item.episodeCount = Number(episodeCount) || 0;
          item.seasonCount = Number(seasonCount) || 0;
        }
      };

      state.homeShows.forEach(update);
      (state.searchResults || []).forEach(update);
      update(show);
    }

    function applyCachedTvMeta(show) {
      const cached = getTvMetaCache()[String(show.id)];
      if (!cached) return show;

      // Running shows change more often; ended shows can be cached for much longer.
      const age = Date.now() - Number(cached.savedAt || 0);
      const maxAge = show.status === "Running"
        ? 24 * 60 * 60 * 1000
        : 90 * 24 * 60 * 60 * 1000;

      if (age > maxAge) return show;

      return {
        ...show,
        episodeCount: Number(cached.episodeCount) || 0,
        seasonCount: Number(cached.seasonCount) || 0
      };
    }

    function validPlayableShow(show) {
      return Boolean(show?.externals?.imdb);
    }

    function normaliseShows(shows) {
      const seen = new Set();

      return shows
        .filter(show => {
          if (!validPlayableShow(show) || seen.has(show.id)) return false;
          seen.add(show.id);
          return true;
        })
        .map(show => applyCachedTvMeta({ ...show, mediaType: "tv" }));
    }

    function getMovieMetaCache() {
      if (movieMetaCacheMemory) return movieMetaCacheMemory;

      try {
        const cache = JSON.parse(localStorage.getItem(MOVIE_META_CACHE_KEY) || "{}");
        movieMetaCacheMemory = cache && typeof cache === "object" ? cache : {};
      } catch {
        movieMetaCacheMemory = {};
      }

      return movieMetaCacheMemory;
    }

    function applyCachedMovieMeta(movie) {
      const imdbId = movie?.imdbId || movie?.id || "";
      const cached = getMovieMetaCache()[imdbId];
      if (!cached) return movie;

      return {
        ...movie,
        runtime: movie.runtime || cached.runtime || "",
        genres: movie.genres?.length ? movie.genres : (cached.genres || []),
        rating: movie.rating || cached.rating || "",
        summary: movie.summary || cached.summary || "",
        backdrop: movie.backdrop || cached.backdrop || ""
      };
    }

    function saveMovieMeta(movie, detail) {
      const imdbId = getImdbId(movie);
      if (!imdbId) return;

      const cache = getMovieMetaCache();
      cache[imdbId] = {
        runtime: detail.runtime || movie.runtime || "",
        genres: detail.genres || movie.genres || [],
        rating: detail.imdbRating || detail.rating || movie.rating || "",
        summary: detail.description || movie.summary || "",
        backdrop: detail.background || movie.backdrop || "",
        savedAt: Date.now()
      };
      scheduleMetaCacheFlush();

      const update = item => {
        if (item?.mediaType !== "movie" || getImdbId(item) !== imdbId) return;
        item.runtime = detail.runtime || item.runtime || "";
        item.genres = detail.genres?.length ? detail.genres : (item.genres || []);
        item.rating = detail.imdbRating || detail.rating || item.rating || "";
        item.summary = detail.description || item.summary || "";
        item.backdrop = detail.background || item.backdrop || "";
      };

      state.homeMovies.forEach(update);
      (state.searchResults || []).forEach(update);
      update(movie);
    }

    function normaliseMovies(movies) {
      const seen = new Set();

      return (movies || []).reduce((result, movie) => {
        const imdbId = movie?.imdbId || movie?.id || "";
        const name = movie?.name || movie?.title || "";

        if (!imdbId.startsWith("tt") || !name || seen.has(imdbId)) {
          return result;
        }

        seen.add(imdbId);

        const releaseInfo = String(movie.releaseInfo || movie.year || "");
        const yearMatch = releaseInfo.match(/\b(18|19|20)\d{2}\b/);

        result.push(applyCachedMovieMeta({
          mediaType: "movie",
          imdbId,
          name,
          poster: movie.poster || "",
          backdrop: movie.background || movie.backdrop || "",
          summary: movie.description || movie.summary || "",
          year: yearMatch ? yearMatch[0] : releaseInfo,
          rating: movie.imdbRating || movie.rating || "",
          genres: Array.isArray(movie.genres) ? movie.genres : [],
          runtime: movie.runtime || ""
        }));

        return result;
      }, []);
    }

    function parseRuntimeMinutes(value) {
      if (Number.isFinite(Number(value)) && Number(value) > 0) {
        return Number(value);
      }

      const text = String(value || "").toLowerCase().trim();
      if (!text) return 0;

      const hours = Number(text.match(/(\d+(?:\.\d+)?)\s*h/)?.[1] || 0);
      const minutes = Number(
        text.match(/(\d+)\s*(?:m|min|mins|minute|minutes)\b/)?.[1] || 0
      );

      if (hours || minutes) return Math.round(hours * 60 + minutes);

      const plain = Number(text.match(/\d+/)?.[0] || 0);
      return plain > 0 ? plain : 0;
    }

    function getRuntimeMinutes(media) {
      if (getMediaType(media) === "movie") {
        return parseRuntimeMinutes(media.runtime);
      }

      return Number(media.averageRuntime || media.runtime || 0);
    }

    function getMediaRating(media) {
      const raw = getMediaType(media) === "movie"
        ? media.rating
        : media.rating?.average;

      const rating = Number(raw);
      return Number.isFinite(rating) ? rating : 0;
    }

    function getYearNumber(media) {
      const year = Number(String(getMediaYear(media)).match(/\d{4}/)?.[0] || 0);
      return Number.isFinite(year) ? year : 0;
    }

    function getAllLoadedItems() {
      return [...state.homeShows, ...state.homeMovies];
    }

    function getCatalogueSource() {
      return state.searchResults !== null
        ? state.searchResults
        : getAllLoadedItems();
    }

    function posterMarkup(media) {
      const image = getMediaPoster(media);
      if (image) {
        return `<img src="${escapeHtml(image)}" alt="${escapeHtml(getMediaName(media))} poster" loading="lazy"
          onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">
          <div class="poster-fallback" style="display:none">${escapeHtml(getMediaName(media))}</div>`;
      }
      return `<div class="poster-fallback">${escapeHtml(getMediaName(media))}</div>`;
    }

    function mediaMeta(media) {
      const bits = [];
      const year = getMediaYear(media);
      const runtime = getRuntimeMinutes(media);

      if (year) bits.push(year);
      if (media.genres?.length) bits.push(media.genres.slice(0, 2).join(" / "));

      const rating = getMediaRating(media);
      if (rating) bits.push(`★ ${rating.toFixed(1).replace(/\.0$/, "")}`);

      const secondary = [];
      if (runtime) secondary.push(`${runtime} min`);

      if (getMediaType(media) === "tv") {
        if (Number(media.seasonCount) > 0) {
          secondary.push(`${media.seasonCount} season${Number(media.seasonCount) === 1 ? "" : "s"}`);
        }
        if (Number(media.episodeCount) > 0) {
          secondary.push(`${media.episodeCount} episodes`);
        }
      }

      return {
        primary: bits.join(" · "),
        secondary: secondary.join(" · ")
      };
    }

    function renderStatus(message, loading = false) {
      showGrid.innerHTML = `
        <div class="status-card">
          <div>
            ${loading ? '<div class="spinner"></div>' : ''}
            ${escapeHtml(message)}
          </div>
        </div>
      `;
      showCount.textContent = "";
    }

    function renderMedia(items, label = null) {
      if (!items.length) {
        const noun = state.filters.type === "movie"
          ? "movies"
          : state.filters.type === "tv"
            ? "TV shows"
            : "titles";
        renderStatus(`No ${noun} match these filters.`);
        return;
      }

      showCount.textContent = label || `${items.length} titles`;

      showGrid.innerHTML = items.map(media => {
        const key = getMediaType(media) === "movie" ? getImdbId(media) : media.id;
        const meta = mediaMeta(media);
        const type = getMediaType(media);

        return `
          <article class="card" data-key="${escapeHtml(key)}" tabindex="0" role="button"
            aria-label="Open ${escapeHtml(getMediaName(media))}">
            <div class="poster">
              <div class="media-type-badge">${type === "movie" ? "MOVIE" : "TV"}</div>
              ${posterMarkup(media)}
            </div>
            <div class="card-body">
              <div class="card-title">${escapeHtml(getMediaName(media))}</div>
              <div class="card-meta">${escapeHtml(meta.primary)}</div>
              ${meta.secondary
                ? `<div class="card-meta-secondary">${escapeHtml(meta.secondary)}</div>`
                : ""}
            </div>
          </article>
        `;
      }).join("");

      const map = new Map(items.map(media => [
        String(getMediaType(media) === "movie" ? getImdbId(media) : media.id),
        media
      ]));

      showGrid.querySelectorAll(".card").forEach(card => {
        const open = () => {
          const media = map.get(card.dataset.key);
          if (!media) return;
          if (getMediaType(media) === "movie") openMovie(media);
          else openShow(media);
        };

        card.addEventListener("click", open);
        card.addEventListener("keydown", event => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            open();
          }
        });
      });
    }

    async function fetchJson(url) {
      const response = await fetch(url);
      const data = await response.json().catch(() => null);

      if (!response.ok) {
        const error = new Error(
          data?.detail || data?.error || `Request failed: ${response.status}`
        );
        error.status = response.status;
        throw error;
      }

      return data;
    }

    function matchesRuntime(runtime, filter) {
      if (filter === "all") return true;
      if (!runtime) return false;
      if (filter === "under30") return runtime < 30;
      if (filter === "30-60") return runtime >= 30 && runtime <= 60;
      if (filter === "60-120") return runtime > 60 && runtime <= 120;
      if (filter === "120plus") return runtime > 120;
      return true;
    }

    function matchesRange(value, filter, ranges) {
      if (filter === "all") return true;
      if (!Number.isFinite(Number(value)) || Number(value) <= 0) return false;
      return ranges[filter]?.(Number(value)) ?? true;
    }

    function filterCatalogue(items) {
      const f = state.filters;

      const episodeRanges = {
        "1-10": value => value >= 1 && value <= 10,
        "11-25": value => value >= 11 && value <= 25,
        "26-50": value => value >= 26 && value <= 50,
        "51-100": value => value >= 51 && value <= 100,
        "100plus": value => value >= 100
      };

      const seasonRanges = {
        "1": value => value === 1,
        "2-3": value => value >= 2 && value <= 3,
        "4-6": value => value >= 4 && value <= 6,
        "7plus": value => value >= 7
      };

      return items.filter(media => {
        const type = getMediaType(media);

        if (f.type !== "all" && type !== f.type) return false;

        if (
          f.genre !== "all" &&
          !media.genres?.some(genre => genre.toLowerCase() === f.genre.toLowerCase())
        ) return false;

        if (!matchesRuntime(getRuntimeMinutes(media), f.runtime)) return false;

        const year = getYearNumber(media);
        if (f.year !== "all") {
          if (!year) return false;
          if (f.year === "2020s" && !(year >= 2020 && year <= 2029)) return false;
          if (f.year === "2010s" && !(year >= 2010 && year <= 2019)) return false;
          if (f.year === "2000s" && !(year >= 2000 && year <= 2009)) return false;
          if (f.year === "1990s" && !(year >= 1990 && year <= 1999)) return false;
          if (f.year === "pre1990" && !(year < 1990)) return false;
        }

        if (f.rating !== "all" && getMediaRating(media) < Number(f.rating)) {
          return false;
        }

        if (f.episodes !== "all") {
          if (type !== "tv") return false;
          if (!matchesRange(media.episodeCount, f.episodes, episodeRanges)) return false;
        }

        if (f.seasons !== "all") {
          if (type !== "tv") return false;
          if (!matchesRange(media.seasonCount, f.seasons, seasonRanges)) return false;
        }

        if (f.status !== "all") {
          if (type !== "tv" || media.status !== f.status) return false;
        }

        return true;
      });
    }

    function sortCatalogue(items) {
      const sorted = [...items];
      const sort = state.filters.sort;

      const compareNumber = (getter, descending = false) => (a, b) => {
        const av = getter(a);
        const bv = getter(b);

        // Unknown values always go last.
        if (!av && bv) return 1;
        if (av && !bv) return -1;
        return descending ? bv - av : av - bv;
      };

      if (sort === "title-asc") {
        sorted.sort((a, b) =>
          getMediaName(a).localeCompare(getMediaName(b), "en", { sensitivity: "base" })
        );
      } else if (sort === "year-desc") {
        sorted.sort(compareNumber(getYearNumber, true));
      } else if (sort === "year-asc") {
        sorted.sort(compareNumber(getYearNumber, false));
      } else if (sort === "runtime-asc") {
        sorted.sort(compareNumber(getRuntimeMinutes, false));
      } else if (sort === "runtime-desc") {
        sorted.sort(compareNumber(getRuntimeMinutes, true));
      } else if (sort === "episodes-desc") {
        sorted.sort(compareNumber(media =>
          getMediaType(media) === "tv" ? Number(media.episodeCount) || 0 : 0, true
        ));
      } else if (sort === "episodes-asc") {
        sorted.sort(compareNumber(media =>
          getMediaType(media) === "tv" ? Number(media.episodeCount) || 0 : 0, false
        ));
      } else {
        sorted.sort(compareNumber(getMediaRating, true));
      }

      return sorted;
    }

    function updateGenreOptions() {
      const selected = state.filters.genre;

      const genres = [...new Set(
        [...getAllLoadedItems(), ...(state.searchResults || [])]
          .flatMap(media => media.genres || [])
          .filter(Boolean)
      )].sort((a, b) => a.localeCompare(b));

      filterGenre.innerHTML = [
        '<option value="all">All genres</option>',
        ...genres.map(genre =>
          `<option value="${escapeHtml(genre)}">${escapeHtml(genre)}</option>`
        )
      ].join("");

      filterGenre.value = genres.some(
        genre => genre.toLowerCase() === selected.toLowerCase()
      ) ? selected : "all";

      if (filterGenre.value === "all") state.filters.genre = "all";
    }

    function updateCatalogueControls() {
      catalogueTitle.textContent = "Movies & TV Shows";
      searchInput.placeholder = "Search movies and TV shows...";

      const searching = Boolean(state.searchTerm);
      catalogueActions.style.display =
        !searching && (state.tvHasMore || state.movieHasMore)
          ? "flex"
          : "none";

      loadMoreButton.textContent = "Load more titles";
      loadMoreButton.disabled = state.loadingTV || state.loadingMovies;
    }

    function updateFilterAvailability() {
      const movieOnly = state.filters.type === "movie";
      filterEpisodes.disabled = movieOnly;
      filterSeasons.disabled = movieOnly;
      filterStatus.disabled = movieOnly;

      if (movieOnly) {
        state.filters.episodes = "all";
        state.filters.seasons = "all";
        state.filters.status = "all";
        filterEpisodes.value = "all";
        filterSeasons.value = "all";
        filterStatus.value = "all";
      }
    }

    function episodeMetadataRequired() {
      return (
        state.filters.episodes !== "all" ||
        state.filters.seasons !== "all" ||
        state.filters.sort.startsWith("episodes")
      );
    }

    function movieRuntimeMetadataRequired() {
      return (
        state.filters.runtime !== "all" ||
        state.filters.sort.startsWith("runtime")
      );
    }

    function renderFilteredCatalogue() {
      updateGenreOptions();
      updateFilterAvailability();

      const source = getCatalogueSource();
      const filtered = sortCatalogue(filterCatalogue(source));

      const sourceLabel = state.searchTerm
        ? `${filtered.length} result${filtered.length === 1 ? "" : "s"} for “${state.searchTerm}”`
        : `${filtered.length} shown · ${source.length} loaded`;

      const waitingForTvCounts = episodeMetadataRequired() && source.some(media =>
        getMediaType(media) === "tv" && !Number(media.episodeCount)
      );

      const waitingForMovieRuntime = movieRuntimeMetadataRequired() && source.some(media =>
        getMediaType(media) === "movie" && !getRuntimeMinutes(media)
      );

      if (!filtered.length && (waitingForTvCounts || waitingForMovieRuntime)) {
        renderStatus("Loading the metadata needed for these filters…", true);
      } else {
        renderMedia(filtered, sourceLabel);
      }

      updateCatalogueControls();

      if (filtered[0]) populateHero(filtered[0]);

      if (episodeMetadataRequired()) queueEpisodeMetadataEnrichment();
      if (movieRuntimeMetadataRequired()) queueMovieMetadataEnrichment();
    }

    async function enrichTvShowMetadata(show) {
      const imdbId = getImdbId(show);

      if (
        !show?.id ||
        !imdbId ||
        Number(show.episodeCount) > 0 ||
        state.episodeMetaLoading.has(show.id)
      ) return;

      state.episodeMetaLoading.add(show.id);

      try {
        // Cinemeta's full series meta contains the episode/video list, so we can
        // count seasons and episodes without burning TVMaze's per-show request budget.
        const data = await fetchJson(
          `${CINEMETA_API}/meta/series/${encodeURIComponent(imdbId)}.json`
        );

        const videos = Array.isArray(data?.meta?.videos)
          ? data.meta.videos
          : [];

        const numbered = videos.filter(video =>
          Number.isFinite(Number(video.season)) &&
          Number.isFinite(Number(video.episode))
        );

        const seasons = new Set(
          numbered.map(video => Number(video.season))
        );

        if (numbered.length) {
          saveTvMeta(show, numbered.length, seasons.size);
          return;
        }

        // Fallback for titles Cinemeta does not fully describe.
        const episodes = await fetchJson(`${TVMAZE_API}/shows/${show.id}/episodes`);
        const tvmazeNumbered = episodes.filter(episode =>
          Number.isInteger(episode.season) && Number.isInteger(episode.number)
        );
        const tvmazeSeasons = new Set(
          tvmazeNumbered.map(episode => episode.season)
        );

        saveTvMeta(show, tvmazeNumbered.length, tvmazeSeasons.size);
      } catch (error) {
        console.warn("TV metadata enrichment failed", error);
      } finally {
        state.episodeMetaLoading.delete(show.id);
      }
    }

    async function queueEpisodeMetadataEnrichment({ force = false } = {}) {
      if (
        state.episodeMetaQueueRunning ||
        (!force && !episodeMetadataRequired())
      ) return;

      const missing = getCatalogueSource().filter(media =>
        getMediaType(media) === "tv" &&
        !Number(media.episodeCount) &&
        media.id &&
        getImdbId(media)
      );

      if (!missing.length) {
        if (!state.movieMetaQueueRunning) {
          filterLoading.classList.remove("visible");
        }
        return;
      }

      state.episodeMetaQueueRunning = true;

      if (episodeMetadataRequired()) {
        filterLoading.classList.add("visible");
      }

      try {
        // Cinemeta handles these requests independently of TVMaze's documented
        // per-IP throttle, so a much larger parallel wave is practical.
        const batch = missing.slice(0, 32);
        await Promise.allSettled(batch.map(enrichTvShowMetadata));

        if (episodeMetadataRequired()) {
          renderFilteredCatalogue();
        }

        const stillMissing = getCatalogueSource().some(media =>
          getMediaType(media) === "tv" &&
          !Number(media.episodeCount) &&
          media.id &&
          getImdbId(media)
        );

        if (stillMissing && (force || episodeMetadataRequired())) {
          setTimeout(() => {
            state.episodeMetaQueueRunning = false;
            queueEpisodeMetadataEnrichment({ force });
          }, 180);
          return;
        }
      } finally {
        if (state.episodeMetaQueueRunning) {
          state.episodeMetaQueueRunning = false;
          if (!state.movieMetaQueueRunning) {
            filterLoading.classList.remove("visible");
          }
        }
      }
    }

    async function enrichMovieMetadata(movie) {
      const imdbId = getImdbId(movie);

      if (
        !imdbId ||
        getRuntimeMinutes(movie) ||
        state.movieMetaLoading.has(imdbId)
      ) return;

      state.movieMetaLoading.add(imdbId);

      try {
        const data = await fetchJson(
          `${CINEMETA_API}/meta/movie/${encodeURIComponent(imdbId)}.json`
        );
        const detail = data?.meta || {};
        saveMovieMeta(movie, detail);
      } catch (error) {
        console.warn("Movie metadata enrichment failed", error);
      } finally {
        state.movieMetaLoading.delete(imdbId);
      }
    }

    async function queueMovieMetadataEnrichment({ force = false } = {}) {
      if (
        state.movieMetaQueueRunning ||
        (!force && !movieRuntimeMetadataRequired())
      ) return;

      const missing = getCatalogueSource().filter(media =>
        getMediaType(media) === "movie" &&
        getImdbId(media) &&
        !getRuntimeMinutes(media)
      );

      if (!missing.length) return;

      state.movieMetaQueueRunning = true;

      if (movieRuntimeMetadataRequired()) {
        filterLoading.classList.add("visible");
      }

      try {
        const batch = missing.slice(0, 32);
        await Promise.allSettled(batch.map(enrichMovieMetadata));

        if (movieRuntimeMetadataRequired()) {
          renderFilteredCatalogue();
        }

        const stillMissing = getCatalogueSource().some(media =>
          getMediaType(media) === "movie" &&
          getImdbId(media) &&
          !getRuntimeMinutes(media)
        );

        if (stillMissing && (force || movieRuntimeMetadataRequired())) {
          setTimeout(() => {
            state.movieMetaQueueRunning = false;
            queueMovieMetadataEnrichment({ force });
          }, 180);
          return;
        }
      } finally {
        if (state.movieMetaQueueRunning) {
          state.movieMetaQueueRunning = false;

          if (!state.episodeMetaQueueRunning) {
            filterLoading.classList.remove("visible");
          }
        }
      }
    }


    function scheduleBackgroundMetadataPreload() {
      if (state.metadataPreloadScheduled) return;
      state.metadataPreloadScheduled = true;

      const run = async () => {
        if (state.metadataPreloadRunning) return;
        state.metadataPreloadRunning = true;

        try {
          // Pre-warm all expensive filter metadata before the user touches the filters.
          await Promise.all([
            queueEpisodeMetadataEnrichment({ force: true }),
            queueMovieMetadataEnrichment({ force: true })
          ]);
        } finally {
          state.metadataPreloadRunning = false;
        }
      };

      if ("requestIdleCallback" in window) {
        requestIdleCallback(run, { timeout: 900 });
      } else {
        setTimeout(run, 350);
      }
    }

    async function loadHomeBatch({ render = true } = {}) {
      if (state.loadingTV || !state.tvHasMore) return;
      state.loadingTV = true;
      updateCatalogueControls();

      try {
        const pages = Array.from(
          { length: HOME_PAGE_BATCH },
          (_, index) => state.nextHomePage + index
        );

        const results = await Promise.all(
          pages.map(page => fetchJson(`${TVMAZE_API}/shows?page=${page}`))
        );

        state.nextHomePage += HOME_PAGE_BATCH;

        const known = new Set(state.homeShows.map(show => show.id));
        const incoming = normaliseShows(results.flat())
          .filter(show => !known.has(show.id));

        if (!incoming.length) {
          state.tvHasMore = false;
        } else {
          state.homeShows = [...state.homeShows, ...incoming];
        }
      } catch (error) {
        if (error?.status === 404) {
          state.tvHasMore = false;
        } else {
          console.error(error);
        }
      } finally {
        state.loadingTV = false;
        if (render) renderFilteredCatalogue();
        else updateCatalogueControls();
      }
    }

    async function loadMovieBatch({ render = true } = {}) {
      if (state.loadingMovies || !state.movieHasMore) return;
      state.loadingMovies = true;
      updateCatalogueControls();

      try {
        const extra = state.nextMovieSkip > 0
          ? `/skip=${state.nextMovieSkip}`
          : "";

        const data = await fetchJson(
          `${CINEMETA_API}/catalog/movie/top${extra}.json`
        );

        const incoming = normaliseMovies(data?.metas || []);

        if (!incoming.length) {
          state.movieHasMore = false;
        } else {
          const known = new Set(state.homeMovies.map(movie => movie.imdbId));
          const uniqueIncoming = incoming.filter(movie => !known.has(movie.imdbId));

          state.homeMovies = normaliseMovies([
            ...state.homeMovies,
            ...uniqueIncoming
          ]);

          state.nextMovieSkip += incoming.length;
          if (!uniqueIncoming.length) state.movieHasMore = false;
        }
      } catch (error) {
        console.error(error);
      } finally {
        state.loadingMovies = false;
        if (render) renderFilteredCatalogue();
        else updateCatalogueControls();
      }
    }

    async function loadMoreTitles() {
      loadMoreButton.disabled = true;
      loadMoreButton.textContent = "Loading…";

      await Promise.all([
        loadHomeBatch({ render: false }),
        loadMovieBatch({ render: false })
      ]);

      renderFilteredCatalogue();
      state.metadataPreloadScheduled = false;
      scheduleBackgroundMetadataPreload();
    }

    async function loadInitialCatalogue() {
      renderStatus("Loading movies and TV shows…", true);

      await Promise.all([
        loadHomeBatch({ render: false }),
        loadMovieBatch({ render: false })
      ]);

      renderFilteredCatalogue();
      scheduleBackgroundMetadataPreload();
    }

    function populateHero(media) {
      if (!media) return;
      const isMovie = getMediaType(media) === "movie";

      heroEyebrow.textContent = isMovie ? "Featured movie" : "Featured TV series";
      el("heroTitle").textContent = getMediaName(media);
      el("heroDescription").textContent = getMediaSummary(media) ||
        (isMovie
          ? "Choose a film and watch it without leaving ShowHub."
          : "Choose a season and episode and watch without leaving ShowHub.");

      const image = getMediaBackdrop(media);
      el("heroBg").style.backgroundImage = image ? `url("${image}")` : "";
      el("heroBrowse").textContent = isMovie ? "Play movie" : "Browse episodes";
      el("heroBrowse").onclick = () => isMovie ? openMovie(media) : openShow(media);
    }

    async function searchCatalogue(query) {
      const term = query.trim();
      state.searchTerm = term;

      if (!term) {
        state.searchResults = null;
        renderFilteredCatalogue();
        return;
      }

      catalogueActions.style.display = "none";
      renderStatus(`Searching for “${term}”…`, true);

      try {
        const [tvResult, movieResult] = await Promise.allSettled([
          fetchJson(`${TVMAZE_API}/search/shows?q=${encodeURIComponent(term)}`),
          fetchJson(
            `${CINEMETA_API}/catalog/movie/top/search=${encodeURIComponent(term)}.json`
          )
        ]);

        if (searchInput.value.trim() !== term) return;

        const shows = tvResult.status === "fulfilled"
          ? normaliseShows(tvResult.value.map(result => result.show))
          : [];

        const movies = movieResult.status === "fulfilled"
          ? normaliseMovies(movieResult.value?.metas || [])
          : [];

        state.searchResults = [...shows, ...movies];
        renderFilteredCatalogue();
      } catch (error) {
        console.error(error);
        renderStatus("Search failed. Try again.");
      }
    }

    function buildTvWatchUrl(show, season, episode, startAt = 0) {
      const params = new URLSearchParams({ autoPlay: "true" });
      if (Number(startAt) >= 5) params.set("startAt", String(Math.floor(Number(startAt))));
      return `https://vidfast.vc/tv/${encodeURIComponent(getImdbId(show))}/${season}/${episode}?${params.toString()}`;
    }

    function buildMovieWatchUrl(movie, startAt = 0) {
      const params = new URLSearchParams({ autoPlay: "true" });
      if (Number(startAt) >= 5) params.set("startAt", String(Math.floor(Number(startAt))));
      return `https://vidfast.vc/movie/${encodeURIComponent(getImdbId(movie))}?${params.toString()}`;
    }

    function launchPlayer(media, url, subtitle, playbackState) {
      state.activePlayback = { media, ...playbackState };
      state.lastProgressWrite = 0;
      state.pendingEpisodeAdvance = false;
      state.episodeAdvanceInFlight = false;
      playerTitle.textContent = getMediaName(media);
      playerSubtitle.textContent = subtitle;

      if (playbackState?.mediaType === "tv") {
        document.title = `${getMediaName(media)} · S${playbackState.season}E${playbackState.episode} | ShowHub`;
      } else {
        document.title = `${getMediaName(media)} | ShowHub`;
      }

      playerFrame.src = url;
      playerScreen.classList.add("open");
      playerScreen.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
    }

    function getEpisodeFromPlayerMessage(message) {
      const candidates = [
        message?.data,
        message?.data?.media,
        message?.data?.metadata,
        message?.media,
        message?.metadata,
        message
      ];

      for (const candidate of candidates) {
        if (!candidate || typeof candidate !== "object") continue;

        const season = Number(
          candidate.season ?? candidate.seasonNumber ?? candidate.season_number
        );
        const episode = Number(
          candidate.episode ?? candidate.episodeNumber ?? candidate.episode_number
        );

        if (Number.isInteger(season) && season > 0 &&
            Number.isInteger(episode) && episode > 0) {
          return { season, episode };
        }
      }

      return null;
    }

    function syncActiveTvEpisode(season, episode) {
      const active = state.activePlayback;
      if (!active || active.mediaType !== "tv") return false;

      season = Number(season);
      episode = Number(episode);
      if (!Number.isInteger(season) || !Number.isInteger(episode)) return false;

      const changed =
        Number(active.season) !== season ||
        Number(active.episode) !== episode;

      if (!changed) return false;

      active.season = season;
      active.episode = episode;
      state.lastProgressWrite = 0;
      state.pendingEpisodeAdvance = false;

      const episodeData = state.currentEpisodes.find(item =>
        Number(item.season) === season && Number(item.number) === episode
      );
      const episodeName = episodeData?.name || "";

      playerTitle.textContent = getMediaName(active.media);
      playerSubtitle.textContent =
        `Season ${season} · Episode ${episode}` +
        (episodeName ? ` · ${episodeName}` : "");
      document.title = `${getMediaName(active.media)} · S${season}E${episode} | ShowHub`;

      const entry = makeWatchEntry(active.media, {
        mediaType: "tv",
        season,
        episode
      }, null);
      entry.currentTime = 0;
      entry.duration = 0;
      entry.lastWatched = Date.now();
      saveWatchEntry(entry);

      const imdbId = getImdbId(active.media);
      if (imdbId && location.hash.startsWith("#watch=")) {
        history.replaceState(
          {
            player: true,
            mediaType: "tv",
            title: getMediaName(active.media),
            season,
            episode
          },
          "",
          `#watch=${encodeURIComponent(imdbId)}-s${season}e${episode}`
        );
      }

      return true;
    }

    async function getNextEpisodeForActivePlayback() {
      const active = state.activePlayback;
      if (!active || active.mediaType !== "tv") return null;

      let episodes = [];
      const showId = Number(active.media?.id || 0);

      if (state.currentEpisodes.length &&
          (!state.currentShow?.id || Number(state.currentShow.id) === showId)) {
        episodes = state.currentEpisodes;
      }

      if (!episodes.length && showId) {
        try {
          const fetched = await fetchJson(`${TVMAZE_API}/shows/${showId}/episodes`);
          episodes = fetched.filter(item =>
            Number.isInteger(item.season) && Number.isInteger(item.number)
          );

          // Keep the episode names available for the player heading and history card.
          state.currentShow = active.media;
          state.currentEpisodes = episodes;
        } catch (error) {
          console.warn("Could not load the next episode from TVMaze.", error);
        }
      }

      if (episodes.length) {
        const ordered = [...episodes].sort((a, b) =>
          a.season - b.season || a.number - b.number
        );
        const currentIndex = ordered.findIndex(item =>
          Number(item.season) === Number(active.season) &&
          Number(item.number) === Number(active.episode)
        );

        if (currentIndex >= 0 && currentIndex + 1 < ordered.length) {
          const next = ordered[currentIndex + 1];
          return { season: Number(next.season), episode: Number(next.number) };
        }
      }

      // Fallback if TVMaze is temporarily unavailable. This still handles the
      // common case of moving to the next episode within the same season.
      return { season: Number(active.season), episode: Number(active.episode) + 1 };
    }

    async function syncToNextEpisodeAfterPlayerAdvance(currentTime, duration, eventName) {
      if (state.episodeAdvanceInFlight) return;
      state.episodeAdvanceInFlight = true;

      try {
        const next = await getNextEpisodeForActivePlayback();
        if (!next || !state.activePlayback) return;

        syncActiveTvEpisode(next.season, next.episode);
        updatePlaybackProgress(currentTime, duration, eventName);
      } finally {
        state.pendingEpisodeAdvance = false;
        state.episodeAdvanceInFlight = false;
      }
    }

    function openEpisode(show, season, episode, options = {}) {
      closeModal();
      const imdbId = getImdbId(show);
      const existing = getSavedPlayback(imdbId);
      const requestedStart = Number(options.startAt);
      const isSameEpisode = existing?.mediaType !== "movie" &&
        Number(existing?.season) === Number(season) &&
        Number(existing?.episode) === Number(episode);
      const startAt = Number.isFinite(requestedStart)
        ? requestedStart
        : isSameEpisode ? Number(existing?.currentTime) || 0 : 0;

      const watchEntry = makeWatchEntry(show, {
        mediaType: "tv",
        season: Number(season),
        episode: Number(episode)
      }, isSameEpisode ? existing : null);
      watchEntry.lastWatched = Date.now();
      saveWatchEntry(watchEntry);

      launchPlayer(
        show,
        buildTvWatchUrl(show, season, episode, startAt),
        `Season ${season} · Episode ${episode}` +
          (startAt >= 5 ? ` · Resuming at ${formatWatchTime(startAt)}` : ""),
        { mediaType: "tv", season: Number(season), episode: Number(episode) }
      );

      history.pushState(
        { player: true, mediaType: "tv", title: getMediaName(show), season, episode },
        "",
        `#watch=${encodeURIComponent(imdbId)}-s${season}e${episode}`
      );
    }

    function openMovie(movie, options = {}) {
      closeModal();
      const imdbId = getImdbId(movie);
      if (!imdbId) return;

      const existing = getSavedPlayback(imdbId);
      const requestedStart = Number(options.startAt);
      const startAt = Number.isFinite(requestedStart)
        ? requestedStart
        : existing?.mediaType === "movie" ? Number(existing.currentTime) || 0 : 0;

      const watchEntry = makeWatchEntry(movie, { mediaType: "movie" },
        existing?.mediaType === "movie" ? existing : null);
      watchEntry.lastWatched = Date.now();
      saveWatchEntry(watchEntry);

      launchPlayer(
        movie,
        buildMovieWatchUrl(movie, startAt),
        "Movie" + (startAt >= 5 ? ` · Resuming at ${formatWatchTime(startAt)}` : ""),
        { mediaType: "movie", season: null, episode: null }
      );

      history.pushState(
        { player: true, mediaType: "movie", title: getMediaName(movie) },
        "",
        `#watch=${encodeURIComponent(imdbId)}-movie`
      );
    }

    function closePlayer({ useHistory = true } = {}) {
      playerScreen.classList.remove("open");
      playerScreen.setAttribute("aria-hidden", "true");
      playerFrame.src = "";
      state.activePlayback = null;
      state.pendingEpisodeAdvance = false;
      state.episodeAdvanceInFlight = false;
      document.body.style.overflow = "";
      document.title = "ShowHub";

      if (useHistory && location.hash.startsWith("#watch=")) history.back();
    }

    async function openShow(show) {
      if (!validPlayableShow(show)) return;

      state.currentShow = show;
      state.currentSeason = 1;
      state.currentEpisodes = [];
      modalTitle.textContent = show.name;
      modalDescription.textContent = getMediaSummary(show) || "Loading episode information…";

      const bg = getMediaBackdrop(show);
      modalBanner.style.backgroundImage = bg
        ? `url("${bg}")`
        : "linear-gradient(135deg, rgba(124,92,255,.22), #151821)";

      seasonSelect.innerHTML = `<option>Loading…</option>`;
      seasonSelect.disabled = true;
      continueButton.disabled = true;
      episodeGrid.innerHTML = `
        <div class="status-card">
          <div><div class="spinner"></div>Loading episodes…</div>
        </div>
      `;

      modalWrap.classList.add("open");
      modalWrap.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";

      try {
        const episodes = await fetchJson(`${TVMAZE_API}/shows/${show.id}/episodes`);
        state.currentEpisodes = episodes.filter(episode =>
          Number.isInteger(episode.season) && Number.isInteger(episode.number)
        );

        const seasons = [...new Set(state.currentEpisodes.map(episode => episode.season))]
          .sort((a, b) => a - b);

        saveTvMeta(show, state.currentEpisodes.length, seasons.length);

        if (!seasons.length) {
          seasonSelect.innerHTML = "";
          episodeGrid.innerHTML = `<div class="status-card">No numbered episodes were found for this show.</div>`;
          return;
        }

        seasonSelect.innerHTML = seasons.map(
          season => `<option value="${season}">Season ${season}</option>`
        ).join("");
        seasonSelect.disabled = false;
        state.currentSeason = seasons[0];
        renderEpisodes();
      } catch (error) {
        console.error(error);
        seasonSelect.innerHTML = "";
        episodeGrid.innerHTML = `<div class="status-card">Could not load episodes for this show.</div>`;
      }
    }

    function renderEpisodes() {
      const show = state.currentShow;
      const season = Number(seasonSelect.value);
      state.currentSeason = season;

      const episodes = state.currentEpisodes
        .filter(episode => episode.season === season)
        .sort((a, b) => a.number - b.number);

      if (!episodes.length) {
        episodeGrid.innerHTML = `<div class="status-card">No episodes found for this season.</div>`;
        continueButton.disabled = true;
        return;
      }

      episodeGrid.innerHTML = episodes.map(episode => `
        <button class="episode" data-episode="${episode.number}">
          <strong>Episode ${episode.number}</strong>
          <span class="episode-name">${escapeHtml(episode.name || "")}</span>
          <small>S${season} E${episode.number}</small>
        </button>
      `).join("");

      episodeGrid.querySelectorAll(".episode").forEach(button => {
        button.addEventListener("click", () =>
          openEpisode(show, season, Number(button.dataset.episode))
        );
      });

      continueButton.disabled = false;
      continueButton.textContent = `Play episode ${episodes[0].number}`;
      continueButton.onclick = () => openEpisode(show, season, episodes[0].number);
    }

    function closeModal() {
      modalWrap.classList.remove("open");
      modalWrap.setAttribute("aria-hidden", "true");
      if (!playerScreen.classList.contains("open")) document.body.style.overflow = "";
    }

    seasonSelect.addEventListener("change", renderEpisodes);

    const filterBindings = [
      [filterType, "type"],
      [filterGenre, "genre"],
      [filterRuntime, "runtime"],
      [filterEpisodes, "episodes"],
      [filterSeasons, "seasons"],
      [filterYear, "year"],
      [filterRating, "rating"],
      [filterStatus, "status"],
      [filterSort, "sort"]
    ];

    filterBindings.forEach(([element, key]) => {
      element.addEventListener("change", () => {
        state.filters[key] = element.value;
        renderFilteredCatalogue();
      });
    });

    resetFilters.addEventListener("click", () => {
      state.filters = {
        type: "all",
        genre: "all",
        runtime: "all",
        episodes: "all",
        seasons: "all",
        year: "all",
        rating: "all",
        status: "all",
        sort: "rating-desc"
      };

      filterType.value = "all";
      filterGenre.value = "all";
      filterRuntime.value = "all";
      filterEpisodes.value = "all";
      filterSeasons.value = "all";
      filterYear.value = "all";
      filterRating.value = "all";
      filterStatus.value = "all";
      filterSort.value = "rating-desc";
      renderFilteredCatalogue();
    });

    searchInput.addEventListener("input", event => {
      clearTimeout(state.searchTimer);
      const value = event.target.value;
      state.searchTimer = setTimeout(() => searchCatalogue(value), 300);
    });

    loadMoreButton.addEventListener("click", loadMoreTitles);

    el("closeModal").addEventListener("click", closeModal);
    el("playerBack").addEventListener("click", () => closePlayer());

    modalWrap.addEventListener("click", event => {
      if (event.target === modalWrap) closeModal();
    });

    window.addEventListener("message", event => {
      if (!isVidFastOrigin(event.origin)) return;
      if (event.source !== playerFrame.contentWindow) return;

      let message = event.data;
      if (typeof message === "string") {
        try {
          message = JSON.parse(message);
        } catch {
          return;
        }
      }

      if (!message || typeof message !== "object") return;

      // VidFast may include the current season/episode in PLAYER_EVENT or
      // MEDIA_DATA messages. If it does, treat that as the source of truth.
      const playerEpisode = getEpisodeFromPlayerMessage(message);
      if (playerEpisode && state.activePlayback?.mediaType === "tv") {
        syncActiveTvEpisode(playerEpisode.season, playerEpisode.episode);
      }

      if (message.type !== "PLAYER_EVENT" && message.type !== "MEDIA_DATA") return;

      const data = message.data || message;
      const eventName = data.event || "";
      const currentTime = Number(data.currentTime);
      const duration = Number(data.duration);
      const hasPlaybackTime =
        Number.isFinite(currentTime) || Number.isFinite(duration);

      if (message.type === "PLAYER_EVENT" && eventName === "ended" &&
          state.activePlayback?.mediaType === "tv") {
        // Save the completed episode first, then wait for VidFast to start the
        // next one. The next play/timeupdate event will move the outer app too.
        if (hasPlaybackTime) {
          updatePlaybackProgress(currentTime, duration, eventName);
        }
        state.pendingEpisodeAdvance = true;
        return;
      }

      const looksLikeFreshEpisodePlayback =
        state.pendingEpisodeAdvance &&
        state.activePlayback?.mediaType === "tv" &&
        ["play", "timeupdate", "playerstatus"].includes(eventName) &&
        Number.isFinite(currentTime) && currentTime >= 0 && currentTime < 60;

      if (looksLikeFreshEpisodePlayback) {
        // If VidFast did not include season/episode metadata, infer the next
        // episode from TVMaze only after the new video actually begins.
        syncToNextEpisodeAfterPlayerAdvance(currentTime, duration, eventName);
        return;
      }

      if (hasPlaybackTime) {
        updatePlaybackProgress(currentTime, duration, eventName);
      }
    });

    window.addEventListener("popstate", () => {
      if (playerScreen.classList.contains("open")) closePlayer({ useHistory: false });
    });

    document.addEventListener("keydown", event => {
      if (event.key !== "Escape") return;
      if (playerScreen.classList.contains("open")) {
        closePlayer();
        return;
      }
      if (modalWrap.classList.contains("open")) closeModal();
    });

    migrateWatchHistory();
    renderContinueWatching();
    updateCatalogueControls();
    loadInitialCatalogue();
  </script>

</body>
</html>
